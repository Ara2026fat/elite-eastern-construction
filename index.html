<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بناء الشرق — نظام المكتب</title>
<meta name="theme-color" content="#0A4F45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بناء الشرق">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='104' fill='%230A4F45'/%3E%3Cpath d='M256 96l144 88v144l-144 88-144-88V184z' fill='none' stroke='%23C9A227' stroke-width='24'/%3E%3Cpath d='M256 208v112M200 264h112' stroke='%23C9A227' stroke-width='24' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='104' fill='%230A4F45'/%3E%3Cpath d='M256 96l144 88v144l-144 88-144-88V184z' fill='none' stroke='%23C9A227' stroke-width='24'/%3E%3Cpath d='M256 208v112M200 264h112' stroke='%23C9A227' stroke-width='24' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;: &quot;مؤسسة بناء الشرق المميز للخدمات العقارية&quot;, &quot;short_name&quot;: &quot;بناء الشرق&quot;, &quot;start_url&quot;: &quot;./&quot;, &quot;scope&quot;: &quot;./&quot;, &quot;display&quot;: &quot;standalone&quot;, &quot;orientation&quot;: &quot;portrait&quot;, &quot;background_color&quot;: &quot;%230C1A18&quot;, &quot;theme_color&quot;: &quot;%230A4F45&quot;, &quot;dir&quot;: &quot;rtl&quot;, &quot;lang&quot;: &quot;ar&quot;, &quot;icons&quot;: [{&quot;src&quot;: &quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='104' fill='%230A4F45'/%3E%3Cpath d='M256 96l144 88v144l-144 88-144-88V184z' fill='none' stroke='%23C9A227' stroke-width='24'/%3E%3Cpath d='M256 208v112M200 264h112' stroke='%23C9A227' stroke-width='24' stroke-linecap='round'/%3E%3C/svg%3E&quot;, &quot;sizes&quot;: &quot;any&quot;, &quot;type&quot;: &quot;image/svg+xml&quot;, &quot;purpose&quot;: &quot;any maskable&quot;}]}">
<style>
:root{--ink:#0C1A18;--jade:#0A4F45;--jade2:#0E6B5C;--saff:#B57A1E;--clay:#A63A26;
--mineral:#EDF1F0;--white:#fff;--line:#DBE3E1;--muted:#5A6A68;--faint:#8E9C9A;--gold:#C9A227;
--sans:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;--dir:-1}
html[dir=ltr]{--dir:1}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--mineral);color:var(--ink);font-size:15px;line-height:1.65;
display:flex;justify-content:center;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-appearance:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);
border-radius:11px;background:var(--white);color:var(--ink);-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade);outline-offset:-1px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* لا قصّ على هذه الحاوية: الشريط العلوي lاصق (sticky)، وأي قصّ فوقه
   يجعله يلتصق بالحاوية لا بالشاشة فينزلق معها. القصّ يبقى محصورًا
   في اللوح وحده — وهو العنصر الوحيد الذي يتجاوز العرض. */
.app{width:100%;max-width:540px;min-height:100vh;position:relative;
  padding-bottom:calc(74px + env(safe-area-inset-bottom))}
html,body{max-width:100%}

/* login */
.login{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px}
.login .brand{font-size:34px;font-weight:800;letter-spacing:.06em;color:var(--jade);text-align:center}
.login .brand i{font-style:normal;color:var(--gold)}
.login .tag{text-align:center;color:var(--muted);font-size:13.5px;margin:5px 0 26px}
.login .card{background:var(--white);border-radius:18px;padding:20px}
.accts{margin-top:14px}
.acct{display:flex;gap:10px;align-items:center;padding:11px;border-radius:12px;background:var(--white);margin-bottom:7px;width:100%;text-align:start}

/* header */
.hd{background:linear-gradient(165deg,var(--jade2),var(--jade));color:#fff;padding:12px 16px 0;
padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(12,26,24,.13)}
.hr{display:flex;align-items:center;gap:8px;min-width:0}
/* عناصر مرنة لا تنكمش افتراضيًا. بلا هذه الأسطر يوسّع أي اسم طويل
   الشريط عن عرض الشاشة فتنزلق الصفحة كلها جانبًا. */
.lg{font-weight:800;font-size:14px;letter-spacing:.06em;min-width:0;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg i{font-style:normal;color:var(--gold)}
.sp{flex:1 1 auto;min-width:4px}
.pill{border:1px solid rgba(255,255,255,.32);border-radius:20px;padding:5px 10px;font-size:11.5px;
  font-weight:700;white-space:nowrap;flex:0 0 auto;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.pill.g{background:rgba(201,162,39,.22);border-color:rgba(201,162,39,.45)}
.hd h1{font-size:20px;font-weight:800;margin-top:9px;letter-spacing:-.01em}
.hd .sub{font-size:12px;opacity:.68;margin-top:1px;margin-bottom:11px}
.subs{display:flex;gap:4px;overflow-x:auto;padding-bottom:9px;margin:0 -16px;padding-inline:16px}
.subs::-webkit-scrollbar{display:none}
.sb{padding:7px 13px;border-radius:18px;font-size:12.5px;white-space:nowrap;flex:0 0 auto;
background:rgba(255,255,255,.13);color:rgba(255,255,255,.82);transition:all .2s}
.sb.on{background:#fff;color:var(--jade);font-weight:800}

.stage{padding:14px 14px 20px;animation:in .26s cubic-bezier(.22,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateX(calc(15px * var(--dir)))}to{opacity:1;transform:none}}
.stage.up{animation:up .22s}@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.bar{position:fixed;bottom:0;inset-inline:0;margin:0 auto;max-width:540px;z-index:40;background:rgba(255,255,255,.96);
backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);display:flex;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.bt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;color:var(--faint);position:relative;transition:color .2s}
.bt .i{font-size:19px;line-height:1;transition:transform .2s}
.bt .l{font-size:10px;font-weight:700;white-space:nowrap}
.bt.on{color:var(--jade)}.bt.on .i{transform:translateY(-2px) scale(1.08)}
.bt .dot{position:absolute;top:2px;inset-inline-start:calc(50% + 7px);min-width:16px;height:16px;border-radius:9px;
background:var(--clay);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));inset-inline-end:calc(50% - 250px);width:52px;height:52px;
border-radius:17px;background:var(--ink);color:#fff;font-size:25px;display:grid;place-items:center;z-index:41;box-shadow:0 6px 20px rgba(12,26,24,.3)}
.fab:active{transform:scale(.92)}
@media(max-width:560px){.fab{inset-inline-end:18px}}

.k{background:var(--white);border-radius:15px;padding:14px;margin-bottom:10px}
.sec{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 3px 8px;display:flex;align-items:baseline;gap:6px}
.sec b{font-size:11px;color:var(--faint);font-weight:700}
.hero{border-radius:16px;padding:15px;margin-bottom:10px;color:#fff;background:var(--ink)}
.hero.a{background:linear-gradient(155deg,#B84029,#8C2C1B)}
.hero.w{background:linear-gradient(155deg,#C48A24,#9A6612)}
.hero.g{background:linear-gradient(155deg,var(--jade2),var(--jade))}
.hero .t{font-size:12px;opacity:.75}.hero .v{font-size:33px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.hero .v small{font-size:12px;font-weight:500;opacity:.6;margin-inline-start:5px}
.hero .f{font-size:12px;opacity:.75;margin-top:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.m{background:var(--white);border-radius:13px;padding:12px}
.m .t{font-size:11px;color:var(--muted)}.m .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.m.a .v{color:var(--clay)}.m.w .v{color:var(--saff)}.m.g .v{color:var(--jade)}
.r{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--white);border-radius:14px;margin-bottom:8px;width:100%;text-align:start}
.r.top{align-items:flex-start}
.ic{width:38px;height:38px;border-radius:12px;background:var(--mineral);display:grid;place-items:center;font-size:17px;font-weight:800;color:var(--muted);flex:0 0 auto}
.ic.a{background:#F8E7E3;color:var(--clay)}.ic.w{background:#FAF0DC;color:var(--saff)}.ic.g{background:#E2EEEB;color:var(--jade)}
.rm{flex:1;min-width:0}
.rt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs.wrap{white-space:normal}
.rv{text-align:end;flex:0 0 auto}.rn{font-weight:800;font-size:15px;letter-spacing:-.02em}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap;display:inline-block}
.t-g{background:#E2EEEB;color:var(--jade)}.t-w{background:#FAF0DC;color:#8A5D12}
.t-a{background:#F8E7E3;color:var(--clay)}.t-n{background:var(--mineral);color:var(--muted)}
.t-o{background:#0C1A18;color:var(--gold)}
.bars{height:4px;background:var(--mineral);border-radius:3px;overflow:hidden;margin-top:7px}
.bars i{display:block;height:100%;border-radius:3px;background:var(--jade);transition:width .4s}
.bars.w i{background:var(--saff)}.bars.a i{background:var(--clay)}
.p{background:var(--white);border-radius:15px;overflow:hidden;margin-bottom:10px}
.p-i{height:112px;background:linear-gradient(140deg,#D9E5E2,#EFF3F2);display:grid;place-items:center;font-size:30px;position:relative;background-size:cover;background-position:center}
.p-b{padding:11px 13px}.p-t{font-weight:700;font-size:14.5px}
.p-l{font-size:12px;color:var(--muted);margin-bottom:7px}
.p-p{font-size:19px;font-weight:800;letter-spacing:-.025em}
.p-p small{font-size:10.5px;font-weight:500;color:var(--faint);margin-inline-start:3px}
.p-m{display:flex;gap:11px;font-size:11.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.p-m b{font-weight:700;color:var(--ink)}
.board{display:flex;gap:8px;overflow-x:auto;margin:0;padding:0 14px 6px;
  scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.board::-webkit-scrollbar{display:none}
/* تدرّج على الحافة يقول «هنا يكمل» — بدونه يُقرأ القصّ كخطأ لا كتمرير */
.boardw{position:relative;margin:0 -14px;overflow:hidden}
.boardw:after{content:'';position:absolute;top:0;bottom:6px;inset-inline-end:0;width:26px;
  background:linear-gradient(to left,var(--mineral),transparent);pointer-events:none}
html[dir=ltr] .boardw:after{background:linear-gradient(to right,var(--mineral),transparent)}
.swipe{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0 8px;letter-spacing:.02em}
/* العمود كان ضيّقًا فتخرج الأسماء الطويلة منه. يتّسع مع الشاشة ويلتقط عند التمرير */
.col{flex:0 0 min(70vw,196px);scroll-snap-align:start;min-width:0}
.ch{font-size:11.5px;font-weight:800;color:var(--muted);padding:0 3px 6px;display:flex;
  justify-content:space-between;gap:6px}
.ch span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc{background:var(--white);border-radius:12px;padding:10px;margin-bottom:6px;width:100%;
  text-align:start;min-width:0}
.dc.st{border-inline-start:3px solid var(--saff)}
/* اسم عميل أو عنوان عقار طويل يلتفّ سطرين ثم ينقطع، ولا يدفع البطاقة خارج الشاشة */
.dc .t,.dc .s{overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;
  -webkit-box-orient:vertical;overflow:hidden}
.dc .t{font-weight:700;font-size:13px;line-height:1.4;-webkit-line-clamp:2}
.dc .s{font-size:11px;color:var(--muted);line-height:1.45;-webkit-line-clamp:2}
.dc .v{font-weight:800;font-size:13px;margin-top:4px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--white);border-radius:15px;padding:14px;text-align:start;position:relative}
.tile .i{width:36px;height:36px;border-radius:11px;background:var(--mineral);display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.tile .t{font-weight:700;font-size:14px}.tile .d{font-size:11.5px;color:var(--muted);line-height:1.5}
.tile .n{position:absolute;top:12px;inset-inline-start:12px;font-size:17px;font-weight:800;color:var(--jade)}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.pk{max-width:100%;overflow-wrap:anywhere}
.bubble{overflow-wrap:anywhere;word-break:break-word}
.sheet{overflow-x:hidden}
.rt,.rs,.rn{overflow-wrap:anywhere;min-width:0}
.pk{padding:8px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--white);color:var(--muted)}
.pk.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:700}
.pk.a.on{background:var(--clay);border-color:var(--clay)}
.photo{border:1.5px dashed var(--line);border-radius:13px;padding:18px;text-align:center;color:var(--faint);font-size:13.5px;
background:var(--white);background-size:cover;background-position:center;min-height:96px;display:grid;place-items:center}
.photo.has{border-style:solid;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.65)}
.btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--jade);color:#fff;font-size:15.5px;font-weight:700;margin-top:10px;text-align:center}
.btn.o{background:var(--white);color:var(--jade);border:1.5px solid var(--jade)}
.btn.g{background:var(--mineral);color:var(--muted)}.btn.d{background:var(--ink)}
.btn.r{background:var(--clay)}
.btn.s{padding:8px 12px;width:auto;font-size:12.5px;margin:0;border-radius:10px;display:inline-block}
.btn[disabled]{opacity:.4}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:10.5px;padding:3px 8px;border-radius:7px;background:#E2EEEB;color:var(--jade);font-weight:700}
.chip.no{background:var(--mineral);color:var(--faint);text-decoration:line-through}
.sc{font-size:19px;font-weight:800;color:var(--jade)}
.empty{text-align:center;padding:30px 18px;color:var(--faint);font-size:13.5px;line-height:1.85}
.empty b{display:block;color:var(--muted);font-weight:700;font-size:14.5px;margin-bottom:4px}
.note{font-size:12px;background:#FCF9F0;border:1px solid #E9DFC3;border-radius:12px;padding:11px 13px;line-height:1.75;margin-bottom:12px;color:#6A5B26}
.bubble{background:#E2EEEB;border-radius:14px;border-start-end-radius:4px;padding:12px 14px;white-space:pre-line;font-size:13px;line-height:1.85;margin-top:9px}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.sh{position:fixed;inset:0;background:rgba(12,26,24,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s;display:flex;align-items:flex-end;justify-content:center}
.sh.on{opacity:1;pointer-events:auto}
.sheet{background:var(--white);width:100%;max-width:540px;border-start-start-radius:22px;border-start-end-radius:22px;
padding:6px 17px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.25,1)}
.sh.on .sheet{transform:none}
.grab{width:36px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 13px}
.sheet h3{font-size:17.5px;font-weight:800}.sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.toast{position:fixed;bottom:calc(94px + env(safe-area-inset-bottom));inset-inline:18px;max-width:480px;margin:0 auto;
background:var(--ink);color:#fff;padding:12px 16px;border-radius:13px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:all .25s;z-index:70;transform:translateY(8px)}
.toast.on{opacity:1;transform:none}
.tl{border-inline-start:2px solid var(--line);padding-inline-start:14px;margin-inline-start:6px}
.tl .e{position:relative;padding-bottom:14px}
.tl .e:before{content:"";position:absolute;inset-inline-start:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--jade)}
</style>
</head>
<style>
/* ── حالة الاتصال ──────────────────────────────────────────────
   الوسيط يقف أمام العقار بلا شبكة. لا يكفي أن يعمل التطبيق،
   بل يجب أن يعرف أنه يعمل، وإلا ظنّ أن ما أدخله ضاع. */
.offbar{
  display:none;position:sticky;top:0;z-index:80;
  background:var(--clay);color:#fff;text-align:center;
  padding:7px 12px;font-size:12.5px;font-weight:600;line-height:1.5;
}
body.off .offbar{display:block}
body.off .hd{background:linear-gradient(140deg,#4A3A2A,#2A1F16)}
</style>
<body>
<div id="offbar" class="offbar">لا يوجد اتصال — التطبيق يعمل وبياناتك محفوظة على هذا الجهاز</div>
<div id="root"></div>
<div class="sh" id="sh" onclick="if(event.target.id==='sh')closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   1 · STORAGE  —  persistence with three drivers
   Everything is written through Repo. Swapping to the Laravel API
   means implementing one driver; no screen changes.
   ════════════════════════════════════════════════════════════════ */
var Store=(function(){
  var mem={},driver='memory';

  // Driver A: the artifact key-value store, when running inside Claude
  var hasKV = typeof window!=='undefined' && window.storage && window.storage.get;
  // Driver B: browser storage, when hosted as a normal web page
  var hasLS=(function(){try{var k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}})();

  driver = hasKV?'kv':(hasLS?'local':'memory');

  function read(k){
    try{
      if(driver==='local'){var v=localStorage.getItem('eec:'+k);return v?JSON.parse(v):null;}
    }catch(e){}
    return mem[k]!==undefined?mem[k]:null;
  }
  function write(k,v){
    mem[k]=v;
    try{ if(driver==='local') localStorage.setItem('eec:'+k,JSON.stringify(v)); }catch(e){}
    if(driver==='kv'){ try{ window.storage.set('eec:'+k,JSON.stringify(v)); }catch(e){} }
  }
  function loadKV(cb){
    if(driver!=='kv')return cb();
    var keys=['db','session'],done=0;
    keys.forEach(function(k){
      window.storage.get('eec:'+k).then(function(r){
        if(r&&r.value){try{mem[k]=JSON.parse(r.value);}catch(e){}}
      }).catch(function(){}).then(function(){ if(++done===keys.length)cb(); });
    });
  }
  return {read:read,write:write,loadKV:loadKV,driver:function(){return driver;}};
})();

/* ════════════════════════════════════════════════════════════════
   2 · REPOSITORY  —  the only path to data
   ════════════════════════════════════════════════════════════════ */
var DB=null;

var Repo={
  // INTEGRATION POINT — the Laravel API lives behind this flag.
  // Set apiBase and every call below routes to the server instead.
  apiBase:null,

  collections:['offices','users','members','contacts','assets','mandates','requirements',
    'deals','viewings','offers','contracts','payments','commissions','enquiries',
    'channels','services','providers','partners','marketers','collabs',
    'tasks','notifications','activity','settings',
    /* المرحلة الثالثة */ 'expenses','settlements','documents'],

  load:function(){
    DB=Store.read('db');
    if(!DB||!DB.offices){ DB=Seed.build(); this.flush(); }
    // forward-compatible: a new collection added later must not break old data
    var self=this;
    this.collections.forEach(function(c){ if(!DB[c]) DB[c]=[]; });
    this.migrate();
    return DB;
  },
  // Bases saved by an older build must keep working. Defaults are filled in
  // once, in place, without touching anything the office already entered.
  migrate:function(){
    var self=this,dirty=false;
    (DB.mandates||[]).forEach(function(m){ if(!m.state){m.state='متاح';dirty=true;} });
    (DB.assets||[]).forEach(function(a){ if(!a.photos){a.photos=a.photo?[a.photo]:[];dirty=true;} });
    (DB.deals||[]).forEach(function(d,i){
      if(!d.no){d.no='D-'+String(2600+i+1);dirty=true;}
      if(!d.purpose){var m=self.find('mandates',d.mandate_id);d.purpose=m?m.purpose:'إيجار';dirty=true;}
    });
    (DB.contracts||[]).forEach(function(c){
      if(!c.kind){c.kind='إيجار';dirty=true;}
      if(!c.end){c.end=addMonths(c.start||nowISO(),12);dirty=true;}
      if(c.status==='active'){c.status='نشط';dirty=true;}
      if(!c.asset_id&&c.mandate_id){var m=self.find('mandates',c.mandate_id);if(m){c.asset_id=m.asset_id;dirty=true;}}
    });
    (DB.payments||[]).forEach(function(p){ if(p.paid===undefined){p.paid=0;dirty=true;} });
    (DB.settings||[]).forEach(function(x){
      if(x.hoods&&!x.hoods_town){x.hoods_town=x.hoods;delete x.hoods;dirty=true;} });
    (DB.assets||[]).forEach(function(a){
      if(a.city===undefined){a.city=cityOfHood(a.hood);dirty=true;} });
    (DB.requirements||[]).forEach(function(r){
      if(!r.cities){var cs=[];
        (r.hoods||[]).forEach(function(h){var c=cityOfHood(h);if(c&&cs.indexOf(c)<0)cs.push(c);});
        r.cities=cs;dirty=true;} });
    if(dirty)this.flush();
  },
  flush:function(){ Store.write('db',DB); },

  all:function(c){ return (DB[c]||[]).filter(function(x){return !x.deleted_at;}); },
  find:function(c,id){ return (DB[c]||[]).filter(function(x){return x.id===id;})[0]; },
  where:function(c,fn){ return this.all(c).filter(fn); },

  insert:function(c,row){
    row.id=row.id||uid();
    row.created_at=row.created_at||nowISO();
    row.office_id=row.office_id||(Session.office&&Session.office.id);
    DB[c].push(row); this.flush(); return row;
  },
  update:function(c,id,patch){
    // Commission entries are append-only: correction is a reversal, never an edit.
    // العمولات وكشوف المالك والسجل: قيود لا حقول. التصحيح بقيد جديد.
    if(c==='commissions'||c==='activity'||c==='settlements'){ throw new Error('IMMUTABLE'); }
    var row=this.find(c,id); if(!row)return null;
    Object.keys(patch).forEach(function(k){row[k]=patch[k];});
    row.updated_at=nowISO(); this.flush(); return row;
  },
  remove:function(c,id){
    var row=this.find(c,id); if(!row)return;
    row.deleted_at=nowISO(); this.flush();
  },
  reset:function(){ DB=Seed.build(); this.flush(); },
  export:function(){ return JSON.stringify(DB,null,1); },
  import:function(json){ DB=JSON.parse(json); this.flush(); }
};

function daysBetween(a,b){return Math.round((new Date(a)-new Date(b))/864e5);}

function match(r){
  var out=[];
  // عقار مؤجَّر أو مباع أو تحت الإدارة لا يدخل المطابقة — القفل عند المصدر لا في الواجهة
  availableMandates().forEach(function(m){
    if(m.purpose!==r.purpose)return;
    var a=asset(m),ok=[],no=[],s=0;
    // مدينة مختلفة ليست ترشيحًا ضعيفًا بل ترشيح خاطئ — تُستبعد لا تُخصم
    if((r.cities||[]).length&&a.city&&r.cities.indexOf(a.city)<0)return;
    // مسار لم يطلبه العميل ليس ترشيحًا ضعيفًا بل غير مرغوب
    if((r.routes||[]).length&&r.routes.indexOf(routeOf(m))<0)return;
    if(m.price>=r.min&&m.price<=r.max){s+=30;ok.push(L('الميزانية','Budget'));}
    else if(m.price<=r.max*1.1){s+=15;no.push(L('الميزانية','Budget'));}else return;
    if((r.hoods||[]).indexOf(a.hood)>-1){s+=25;ok.push(L('الحي','District'));}else no.push(L('الحي','District'));
    // النوع هو الطلب نفسه لا وجه تفضيل: عرض فيلا على طالب شقة هو «إرسال قائمة»
    if((r.types||[]).length&&r.types.indexOf(a.type)<0)return;
    s+=15;ok.push(L('النوع','Type'));
    // غرفة أقل تنازل يُذكر، وغرفتان أقل ليستا الطلب أصلًا.
    // أما العقار الذي لم تُسجَّل غرفه بعد فلا يُرفض — النقص عندنا لا عنده.
    if(!r.beds)s+=10;
    else if(!a.beds){s+=5;no.push(L('الغرف غير مسجّلة','Bedrooms unknown'));}
    else if(a.beds>=r.beds){s+=15;ok.push(L('الغرف','Bedrooms'));}
    else if(a.beds===r.beds-1){s+=7;no.push(L('الغرف','Bedrooms'));}
    else return;
    s+=15;
    if(s>=45)out.push({m:m,a:a,score:Math.round(s),ok:ok,no:no});
  });
  return out.sort(function(x,y){return y.score-x.score;});
}
/* لماذا خرج هذا العرض من نتائج هذا الطلب — سبب واحد صريح لا قائمة */
function whyOut(r,m){
  var a=asset(m);
  if(m.purpose!==r.purpose)return null;                    /* ليس من هذا السوق أصلًا */
  if((r.cities||[]).length&&a.city&&r.cities.indexOf(a.city)<0)return 'city';
  if((r.types||[]).length&&r.types.indexOf(a.type)<0)return 'type';
  if(m.price>r.max)return 'over';
  if(m.price<r.min)return 'under';
  if((r.hoods||[]).length&&r.hoods.indexOf(a.hood)<0)return 'hood';
  if(r.beds&&a.beds&&a.beds<r.beds)return 'beds';
  return null;
}
/* المسافة عن الطلب — تُستخدم لإيجاد «أقرب ما وجدنا» حين لا يطابق شيء */
function missGap(r,m){
  var a=asset(m);
  if(m.price>r.max)return {k:'over',v:m.price-r.max};
  if(r.beds&&a.beds<r.beds)return {k:'beds',v:r.beds-a.beds};
  if((r.hoods||[]).length&&r.hoods.indexOf(a.hood)<0)return {k:'hood',v:0,hood:a.hood};
  return null;
}
/* صيغة العدد بالعربية — «٣ خيارًا» خطأ يُقرأ فيُنقص الثقة */
/* المعدود والصفة يتبعان العدد في العربية. الخطأ هنا يُقرأ فورًا
   ويُنقص هيبة الرسالة أكثر مما يظن كاتبها. */
function nAdj(n,one,two,few,many){
  if(n===1)return one;
  if(n===2)return two;
  if(n<=10)return n+' '+few;
  return n+' '+many;
}
function nAr(n,one,two,few,many){
  if(n===0)return 'لا '+one;
  if(n===1)return one+' واحد';
  if(n===2)return two;
  if(n<=10)return n+' '+few;
  return n+' '+many;
}
function reportData(r){
  var same=availableMandates().filter(function(m){return m.purpose===r.purpose;});
  var all=match(r);
  var hits=all.filter(function(x){return !isMarket(x.m);});
  var spot=all.filter(function(x){return isMarket(x.m);});
  var hitIds={};all.forEach(function(x){hitIds[x.m.id]=1;});
  var rest=same.filter(function(m){return !hitIds[m.id];});
  var tally={},order=['over','hood','type','beds','city','under'];
  rest.forEach(function(m){var k=whyOut(r,m);if(k)tally[k]=(tally[k]||0)+1;});
  /* أقرب ما فاتنا: أقلّها بعدًا عن سقف الميزانية */
  var near=null;
  rest.forEach(function(m){
    var g=missGap(r,m); if(!g)return;
    if(g.k==='over'&&(!near||near.k!=='over'||g.v<near.v))near={k:'over',v:g.v,m:m};
    else if(!near&&g.k==='hood')near={k:'hood',v:0,m:m,hood:g.hood};
  });
  return {pool:same.length,hits:hits,spot:spot,rest:rest.length,
          tally:tally,order:order,near:near};
}

function nextAssignee(){
  var o=Repo.find('offices',Session.office.id);
  var brokers=Repo.where('users',function(u){return u.active&&['broker','manager','owner'].indexOf(u.role)>-1;});
  if(o.assignment!=='rotation'||!brokers.length)return Session.user.id;
  // rotation: whoever received a contact least recently — self-correcting
  var last={};
  Repo.all('contacts').forEach(function(c){ if(c.assigned_to) last[c.assigned_to]=c.created_at; });
  var never=brokers.filter(function(b){return !last[b.id];})[0];
  if(never)return never.id;
  return brokers.sort(function(a,b){return new Date(last[a.id])-new Date(last[b.id]);})[0].id;
}

function restoreSession(){
  var s=Store.read('session');
  if(!s)return false;
  var u=Repo.find('users',s.user_id);
  if(!u||!u.active)return false;
  Session.user=u;Session.office=Repo.find('offices',u.office_id);Session.role=u.role;
  LANG=s.lang||'ar';
  return true;
}
function cryptoOK(){return !!(typeof crypto!=='undefined'&&crypto.subtle&&typeof TextEncoder!=='undefined');}
function hashPw(officeId,pw){
  if(!cryptoOK())return Promise.resolve(null);
  var d=new TextEncoder().encode(String(officeId)+'|'+String(pw));
  return crypto.subtle.digest('SHA-256',d).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){
      return ('0'+b.toString(16)).slice(-2);}).join('');
  });
}
function doLogin(){
  var ph=val('lp').replace(/\D/g,''),pw=val('lw');
  var cand=Repo.all('users').filter(function(x){
    return x.active&&String(x.phone).replace(/\D/g,'')===ph;});
  if(!cand.length){toast(t('wrong'));return;}
  var u=cand[0];
  var done=function(ok){
    if(!ok){toast(t('wrong'));return;}
    Session.user=u;Session.office=Repo.find('offices',u.office_id);Session.role=u.role;
    Store.write('session',{user_id:u.id,lang:LANG});
    logAct('user',u.id,'login','تسجيل دخول','Signed in');
    NAV='today';SUB=0;runChecks();render();
  };
  if(u.pw)return hashPw(u.office_id,pw).then(function(h){done(!!h&&h===u.pw);});
  done(u.pass===pw);               /* حسابات تجريبية قديمة */
  return Promise.resolve();
}

function savePw(){
  var u=Session.user,cur=val('pw0'),a=val('pw1'),b=val('pw2');
  if(a!==b){toast(L('الكلمتان غير متطابقتين','They do not match'));return;}
  if(!a||a.length<6){toast(L('٦ خانات فأكثر','6 characters or more'));return;}
  if(!cryptoOK()){toast(L('افتح الموقع عبر https','Open over https'));return;}
  var check=u.pw?hashPw(u.office_id,cur).then(function(h){return h===u.pw;})
                :Promise.resolve(u.pass===cur);
  return check.then(function(ok){
    if(!ok){toast(L('كلمة المرور الحالية غير صحيحة','Current password is wrong'));return;}
    return hashPw(u.office_id,a).then(function(h){
      Repo.update('users',u.id,{pw:h,pass:null});
      Session.user=Repo.find('users',u.id);
      logAct('user',u.id,'password','غُيّرت كلمة المرور','Password changed');
      closeSheet();toast(t('saved'));
    });
  });
}

function alertsView(){
  var items=[];
  liveMandates().forEach(function(m){
    if(mState(m)!=='متاح'||m.purpose==='إدارة أملاك')return;
    if(isMarket(m)){
      if(m.market_status==='رُصد')items.push({k:'w',t:mandateTitle(m),
        s:L('عقار مرصود لم نتواصل مع مالكه بعد','Spotted, owner not contacted yet'),
        a:L('تواصل الآن','Contact now'),go:'market:'+m.id});
      return;
    }
    var d=daysOnMarket(m);
    if(d>=21&&!viewingsOf(m.id).length)items.push({k:'a',t:mandateTitle(m),
      s:L('مضى '+d+' يومًا بلا معاينة','On market '+d+' days with no viewing'),a:L('راجع السعر أو الصور','Review price or photos')});
    if(m.source!=='partner'&&!authOK(m))
      items.unshift({k:'a',t:mandateTitle(m),
        s:authOf(m)?L('انتهى تفويض المالك','The owner authorization expired')
                   :L('بلا تفويض من المالك','No owner authorization'),
        a:L('اطلبه الآن','Get it now'),go:'auth:'+m.id});
    /* السبب يُقال كما هو: من يُخبَر بسبب خاطئ يصلح الشيء الخطأ */
    if(!(m.channels||[]).length){
      var why = adOK(m) ? null
        : (m.source!=='partner'&&!authOK(m)) ? 'auth'
        : 'lic';
      if(why!=='auth')items.push({k:'w',t:mandateTitle(m),
        s:why===null?L('لم يُنشر في أي قناة','Not published anywhere')
          :L('لا يمكن نشره — بلا ترخيص إعلاني','Cannot be published — no advertising licence'),
        a:why===null?L('انشره الآن','Publish now'):L('سجّل الترخيص','Record the licence'),
        go:'publish:'+m.id});
    }
    var _l=adLic(m);
    if((m.channels||[]).length&&_l&&_l.exp&&daysBetween(_l.exp,new Date())<0)
      items.unshift({k:'a',t:mandateTitle(m),s:L('منشور برخصة إعلان منتهية','Live on an expired ad licence'),
        a:L('اسحبه أو جدّد','Pull it or renew'),go:'publish:'+m.id});
    if(d>=7)items.push({k:'w',t:t('owner_report')+' — '+contactOf(asset(m).owner_id).name_ar,
      s:L('لم يُرسل هذا الأسبوع','Not sent this week'),a:L('أرسله','Send'),go:'owner:'+m.id});
  });
  /* موعد بلا تأكيد أخطر من موعد بلا تذكير — لأن العميل قد لا يعلم به أصلًا */
  Repo.where('viewings',function(v){return v.status==='مجدولة';}).forEach(function(v){
    var hh=(new Date(v.when)-new Date())/36e5;
    if(hh<=0)return;
    if(!v.confirmed_at)items.unshift({k:'a',t:contactOf(v.contact_id).name_ar,
      s:L('معاينة مجدولة بلا تأكيد — '+whenAr(v.when),'Viewing scheduled but never confirmed'),
      a:L('أكّد الموعد الآن','Confirm it now'),go:'vconfirm:'+v.id});
    else if(hh<=24&&!v.reminded_at)items.push({k:'w',t:contactOf(v.contact_id).name_ar,
      s:L('معاينة اليوم — لم يُرسل تذكير','Viewing today — no reminder sent'),
      a:L('ذكّره','Remind'),go:'vremind:'+v.id});
  });
  /* عميل فُتحت له صفقة بلا اتفاق تمثيل: العمولة بلا سند */
  Repo.where('requirements',function(r){return r.status==='active'&&!repOK(r);}).forEach(function(r){
    var live=Repo.where('deals',function(d){return d.contact_id===r.contact_id&&!isClosed(d);}).length;
    if(!live)return;
    items.unshift({k:'a',t:contactOf(r.contact_id).name_ar,
      s:repOf(r)?L('انتهى اتفاق التمثيل وصفقته جارية','Representation expired mid-deal')
                :L('صفقة جارية بلا اتفاق تمثيل — العمولة بلا سند',
                   'A live deal with no representation agreement'),
      a:L('وثّقه الآن','Document it now'),go:'rep:'+r.id});
  });
  Repo.where('requirements',function(r){return r.status==='active'&&slaState(r)==='breached';}).forEach(function(r){
    items.push({k:'a',t:contactOf(r.contact_id).name_ar,
      s:L('طلبه مفتوح منذ '+Math.round(hoursSince(r.created_at))+' ساعة','Open '+Math.round(hoursSince(r.created_at))+'h'),
      a:L('أرسل تقريرًا الآن','Send a report'),go:'client:'+r.id});
  });
  /* دورة الإيجار: متأخر وقارب على الانتهاء */
  Repo.all('payments').forEach(function(p){
    if(payState(p)!=='متأخر')return;
    var ct=Repo.find('contracts',p.contract_id); if(!ct)return;
    items.push({k:'a',t:contactOf(ct.contact_id).name_ar+' — '+M(payRemain(p))+' '+t('sar'),
      s:L('دفعة متأخرة على العقد '+ct.no,'Overdue instalment on '+ct.no),
      a:L('تحصيل الآن','Collect now'),go:'collect'});
  });
  Repo.where('contracts',function(c){return c.status==='نشط';}).forEach(function(ct){
    var dl=daysLeft(ct);
    if(dl<0)items.push({k:'a',t:L('العقد ','Contract ')+ct.no,s:L('انتهت مدته','Term has ended'),
      a:L('جدّده أو أنهه','Renew or end'),go:'contracts'});
    else if(dl<=60)items.push({k:'w',t:L('العقد ','Contract ')+ct.no,
      s:L('ينتهي بعد '+dl+' يومًا','Expires in '+dl+' days'),a:L('ابدأ التجديد','Start renewal'),go:'contracts'});
  });
  /* دورة الإدارة */
  managedMandates().forEach(function(m){
    var b=ownerBook(m.asset_id);
    if(b.earned-b.paid>0)items.push({k:'w',t:contactOf(asset(m).owner_id).name_ar,
      s:L('مستحق للمالك '+M(b.earned-b.paid)+' ريال','Owner is owed '+M(b.earned-b.paid)),
      a:L('جهّز الكشف','Prepare the statement'),go:'stmt:'+m.asset_id});
  });
  (function(){
    var pend=sinceBackup();
    if(pend>=15)items.unshift({k:'a',t:L('نسخة احتياطية','Backup'),
      s:L(pend+' سجلًا لم يُنسخ — البيانات في هذا الجهاز وحده',
          pend+' records not backed up'),
      a:L('نزّلها الآن','Download now'),go:'settings:2'});
  })();
  Repo.where('services',function(x){return x.status==='جديد';}).forEach(function(x){
    items.push({k:'w',t:x.title,s:L('طلب صيانة بلا فني','Maintenance request unassigned'),
      a:L('أسنده','Assign'),go:'srv'});
  });
  (function(){
    var o=Repo.find('offices',Session.office.id)||{};
    if(!o.fal_expiry)return;
    var left=daysBetween(o.fal_expiry,new Date());
    if(left<0)items.unshift({k:'a',t:L('رخصة فال منتهية','FAL expired'),
      s:L('النشاط متوقف نظاميًا حتى التجديد','Activity is suspended until renewal'),
      a:L('جدّدها','Renew'),go:'settings:0'});
    else if(left<=60)items.unshift({k:'w',t:L('رخصة فال','FAL licence'),
      s:L('تنتهي بعد '+left+' يومًا','Expires in '+left+' days'),
      a:L('ابدأ التجديد','Start the renewal'),go:'settings:0'});
  })();
  Repo.where('collabs',function(c){return c.status==='new';}).forEach(function(c){
    items.push({k:'w',t:L('طلب تعاون من ','Collaboration from ')+c.from,s:esc(c.note),a:L('راجعه','Review'),go:'collab'});
  });
  if(!items.length)return '<div class="empty"><b>'+L('لا تنبيهات','No alerts')+'</b>'+L('كل شيء ضمن المسار','All on track')+'</div>';
  return '<div class="sec">'+L('يحتاج تدخّلك','Needs you')+' <b>'+items.length+'</b></div>'+items.map(function(i){
    var act=i.go?' onclick="jump(\''+i.go+'\')"':'';
    return '<button class="r top"'+act+'><div class="ic '+i.k+'">!</div><div class="rm">'+
    '<div class="rt">'+esc(i.t)+'</div><div class="rs wrap">'+i.s+'</div>'+
    '<div class="rs" style="color:var(--jade);font-weight:700">← '+i.a+'</div></div></button>';}).join('');
}

function jump(x){
  var p=x.split(':');
  if(p[0]==='setup'){closeSheet();return setupSheet();}
  if(p[0]==='settings')return go('settings',+p[1]||0);
  if(p[0]==='props')return go('props',+p[1]||0);
  if(p[0]==='clients')return go('clients',+p[1]||0);
  if(p[0]==='team')return go('team',0);
  if(p[0]==='publish')return publishSheet(p[1]);
  if(p[0]==='market')return marketAct(p[1]);
  if(p[0]==='auth')return authSheet(p[1]);
  if(p[0]==='rep')return repSheet(p[1]);
  if(p[0]==='vconfirm')return viewMsgSheet(p[1],'confirm');
  if(p[0]==='vremind')return viewMsgSheet(p[1],'remind');
  if(p[0]==='owner')return ownerReport(p[1]);
  if(p[0]==='client')return clientReport(p[1]);
  if(p[0]==='stmt')return ownerStatement(p[1]);
  if(p[0]==='collect')return go('money',2);
  if(p[0]==='contracts')return go('money',1);
  if(p[0]==='srv')return go('srv',1);
  if(p[0]==='collab')return go('net',2);
}

function weekView(){
  var w=weekScore(),streak=promiseStreak();
  var day=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][stg().week_day||0];
  if(!w.total)return '<div class="empty"><b>'+L('لا أحد ينتظر تقريرًا','Nobody is waiting')+'</b>'+
    L('يبدأ الوعد بأول عقار أو أول طلب','The promise starts with the first listing or request')+'</div>';

  var pct=Math.round(w.done/w.total*100);
  var h=(w.left?'<div class="hero a"><div class="t">'+L('ينتظرون تقريرهم','Awaiting their report')+'</div>'+
      '<div class="v num">'+w.left+'<small>/'+w.total+'</small></div>'+
      '<div class="f">'+L('الأسبوع يبدأ ','Week starts ')+day+'</div></div>'
    :'<div class="hero g"><div class="t">'+L('اكتمل الوعد هذا الأسبوع','Promise kept this week')+'</div>'+
      '<div class="v num">'+w.total+'<small>/'+w.total+'</small></div>'+
      '<div class="f">'+L('لا أحد ينتظر','Nobody is waiting')+'</div></div>');

  h+='<div class="bars '+(w.left?'a':'')+'"><i style="width:'+pct+'%"></i></div>';
  if(streak)h+='<div class="note">'+L('أُوفي بالوعد ','Promise kept ')+
    '<b class="num">'+streak+'</b> '+L('أسبوعًا متتاليًا قبل هذا. السلسلة تُقرأ من السجل لا من ادّعاء.',
      'weeks running. Counted from the log, not from a claim.')+'</div>';
  h+='<div class="note">'+L('التقرير يُرسل ولو لم يجدّ شيء. هذا هو الوعد الوحيد الذي لا يحتاج أن يحدث شيء لنفي به — ولهذا يصلح أن يكون وعدًا.',
    'The report goes out even when nothing happened. That is why it can be a promise at all.')+'</div>';

  ['owner','client'].forEach(function(kind){
    var rows=w.rows.filter(function(x){return x.kind===kind;});
    if(!rows.length)return;
    h+='<div class="sec">'+(kind==='owner'?L('الملّاك','Owners'):L('العملاء','Clients'))+
      ' <b>'+rows.filter(function(x){return !x.done;}).length+'</b></div>';
    h+=rows.map(function(x){
      var ago=x.at?daysBetween(new Date(),x.at):null;
      return '<button class="r top" onclick="'+(kind==='owner'?'ownerReport':'clientReport')+
      '(\''+x.id+'\')"><div class="ic '+(x.done?'g':(x.at?'w':'a'))+'">'+(x.done?'✓':'!')+'</div>'+
      '<div class="rm"><div class="rt">'+esc(x.name)+'</div>'+
      '<div class="rs wrap">'+esc(x.sub)+'</div>'+
      '<div class="rs">'+(x.at
        ? L('آخر تقرير قبل ','Last report ')+'<span class="num">'+ago+'</span> '+L('يومًا','days ago')+
          ' · '+L('أُرسل','sent')+' <span class="num">'+x.n+'</span>'
        : '<b style="color:var(--clay)">'+L('لم يصله تقرير قط','No report ever sent')+'</b>')+
      '</div></div><div class="rv">'+(x.done?'<span class="tag t-g">'+L('تم','Done')+'</span>':'›')+
      '</div></button>';}).join('');
  });
  return h;
}

/* العمولات — القيد الواحد صار مجموعة قيود: إجمالي ثم خصم لكل شريك */
function commissionsView(){
  var coms=Repo.all('commissions').filter(function(x){
    return can('commission.view')||x.beneficiary===Session.user.id;});
  var net=coms.reduce(function(s,x){return s+x.amount;},0);
  var gross=coms.filter(function(x){return x.amount>0;}).reduce(function(s,x){return s+x.amount;},0);
  var out=coms.filter(function(x){return x.amount<0;}).reduce(function(s,x){return s+x.amount;},0);
  var h='<div class="hero g"><div class="t">'+L('صافي عمولات المكتب','Net office commission')+'</div>'+
   '<div class="v num">'+M(net)+'<small>'+t('sar')+'</small></div>'+
   '<div class="f">'+L('إجمالي','Gross')+' <span class="num">'+M(gross)+'</span> · '+
   L('حصص الشركاء والمسوّقين','partner and marketer shares')+' <span class="num">'+M(out)+'</span></div></div>'+
   '<div class="note">'+L('السجل لا يُعدَّل ولا يُحذف. كل مستفيد قيد مستقل، فتُقرأ الحصة دون حساب ذهني.',
    'The ledger is append-only. Every beneficiary is a separate entry, so no share is computed in someone’s head.')+'</div>';
  if(!coms.length)return h+'<div class="empty"><b>'+t('nothing')+'</b>'+
    L('يُنشأ القيد تلقائيًا عند إغلاق صفقة','Created automatically on a closed deal')+'</div>';
  var groups={},order=[];
  coms.forEach(function(x){var k=x.deal_id||x.contract_id||x.id;
    if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(x);});
  return h+order.map(function(k){
    var rows=groups[k],d=Repo.find('deals',k),sum=rows.reduce(function(a,b){return a+b.amount;},0);

    '<div class="rn num" style="color:'+(sum<0?'var(--clay)':'var(--jade)')+'">'+M(sum)+'</div></div>'+
    rows.map(function(x){
      var lbl={gross:L('إجمالي العمولة','Gross'),partner:L('مكتب شريك','Partner office'),
        collab:L('تعاون','Collaboration'),marketer:L('مسوّق','Marketer'),
        renewal:L('تجديد','Renewal')}[x.kind]||(x.amount<0?L('خصم','Deduction'):L('عمولة','Commission'));
      return '<div style="display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)">'+
      '<div class="ic '+(x.amount<0?'a':'g')+'" style="width:30px;height:30px;font-size:13px">'+(x.amount<0?'−':'₪')+'</div>'+
      '<div class="rm"><div class="rt" style="font-size:13px">'+esc(x.who)+' <span class="tag t-n">'+lbl+'</span></div>'+
      '<div class="rs wrap">'+esc(x.reason)+'</div>'+

      '<div class="rv"><div class="rn num" style="color:'+(x.amount<0?'var(--clay)':'var(--jade)')+'">'+M(x.amount)+'</div></div></div>';}).join('')+

    '<div class="m a"><div class="t">'+L('متأخر','Overdue')+'</div><div class="v num">'+M(arr)+'</div></div></div>'+

   :'<div class="hero g"><div class="t">'+L('لا متأخرات','No arrears')+'</div><div class="v num">'+M(dueSum)+

/* ════════════════════════════════════════════════════════════════
   11B · CYCLE ENGINE  —  المرحلة الثالثة
   لا شاشات جديدة. هذه الطبقة تصل ما هو مبني أصلًا:
   معاينة ← صفقة ← عرض ← تفاوض ← عقد ← دفعة ← عمولة ← إغلاق
   عقد ← متأخرات ← تجديد ← انتهاء ← عودة العقار للمطابقة
   إدارة ← تحصيل ← صيانة ← مصروف ← مستحقات المالك
   تعاون ← موافقة ← صفقة ← توزيع العمولة على قيود منفصلة
   ════════════════════════════════════════════════════════════════ */

/* ── حالة العقار: القفل الذي يمنع تأجير عقار مؤجَّر ─────────────── */
function mState(m){return (m&&m.state)||'متاح';}
function setState(mid,s,why){
  var m=Repo.find('mandates',mid); if(!m||mState(m)===s)return;
  Repo.update('mandates',mid,{state:s,state_at:nowISO()});
  logAct('mandate',mid,'state','حالة العقار: '+mState(m)+' ← '+s+(why?' ('+why+')':''),'Property state → '+s);
}
function availableMandates(){
  return Repo.where('mandates',function(m){return m.status==='معتمد'&&mState(m)==='متاح'&&m.purpose!=='إدارة أملاك';});
}
function managedMandates(){
  return Repo.where('mandates',function(m){return m.status==='معتمد'&&m.purpose==='إدارة أملاك';});
}
function stateTag(m){
  var s=mState(m); if(s==='متاح')return '';
  var cls=s==='مؤجر'||s==='مباع'?'t-o':s==='محجوز'?'t-w':'t-n';
  return '<span class="tag '+cls+'">'+bi((MSTATES.filter(function(x){return x[0]===s;})[0])||[s,s])+'</span>';
}

/* ── التاريخ ──────────────────────────────────────────────────── */
function addMonths(iso,n){var d=new Date(iso);d.setMonth(d.getMonth()+Number(n||0));return d.toISOString().slice(0,10);}
function dstr(x){return String(x||'').slice(0,10);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function weekKey(){var d=new Date();return d.getFullYear()+'w'+Math.ceil((((d-new Date(d.getFullYear(),0,1))/864e5)+1)/7);}

/* ── الصفقة: العمود الفقري ────────────────────────────────────── */
function dealOf(id){return Repo.find('deals',id);}
function dealNo(){return 'D-'+String(2600+Repo.all('deals').length+1);}
function dealViewings(id){return Repo.where('viewings',function(v){return v.deal_id===id;});}
function dealOffers(id){return Repo.where('offers',function(o){return o.deal_id===id;})
  .sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at);});}
function dealContract(id){return Repo.where('contracts',function(c){return c.deal_id===id;})[0];}
function stageIndex(s){for(var i=0;i<STAGES.length;i++)if(STAGES[i][0]===s)return i;return -1;}
function isClosed(d){return ['مغلقة','خسارة'].indexOf(d.stage)>-1;}
/* التقدّم للأمام فقط — لا تُرجِع صفقة لمرحلة سابقة تلقائيًا */
function advance(id,stage){
  var d=dealOf(id); if(!d||isClosed(d))return;
  if(stageIndex(stage)>stageIndex(d.stage))moveDeal(id,stage,true);
}
function openDealFor(mid,cid){
  return Repo.where('deals',function(d){return d.mandate_id===mid&&d.contact_id===cid&&!isClosed(d);})[0];
}

/* ── العروض والتفاوض ─────────────────────────────────────────── */
var oDraft={side:'client'};
function offerSheet(dealId,counterOf){
  var d=dealOf(dealId); if(!d)return;
  var prev=counterOf?Repo.find('offers',counterOf):null;
  var c=contactOf(d.contact_id);
  oDraft={side:prev?(prev.side==='client'?'owner':'client'):'client'};
  sheet('<h3>'+(prev?L('عرض مضاد','Counter-offer'):L('تسجيل عرض سعر','Record an offer'))+'</h3>'+
  '<div class="sub">'+esc(c.name_ar)+' · '+L('المطلوب','Asking')+' <span class="num">'+M(d.value)+'</span></div>'+
  (prev?'<div class="bubble">'+L('العرض السابق','Previous')+': <span class="num">'+M(prev.amount)+'</span> — '+
    (prev.side==='client'?L('من العميل','from the client'):L('من المالك','from the owner'))+'</div>':'')+
  '<div class="f" style="margin-top:12px"><label>'+L('مقدَّم من','Submitted by')+'</label><div class="pick">'+
  [['client',L('العميل','Client')],['owner',L('المالك','Owner')]].map(function(x){
    return '<button class="pk '+(oDraft.side===x[0]?'on':'')+'" onclick="oDraft.side=\''+x[0]+'\';offerSheet(\''+dealId+'\''+(counterOf?',\''+counterOf+'\'':'')+')">'+x[1]+'</button>';}).join('')+'</div></div>'+
  '<div class="f"><label>'+L('المبلغ','Amount')+'</label><input id="ofa" type="number" inputmode="numeric" value="'+(prev?prev.amount:d.value)+'"></div>'+
  '<div class="f"><label>'+L('ملاحظة','Note')+'</label><input id="ofn" placeholder="'+L('شروط، مدة، دفعات','terms, term, instalments')+'"></div>'+
  '<button class="btn" onclick="saveOffer(\''+dealId+'\''+(counterOf?',\''+counterOf+'\'':'')+')">'+t('save')+'</button>');
}
function saveOffer(dealId,counterOf){
  var amt=+val('ofa'); if(!amt){toast(L('أدخل المبلغ','Enter an amount'));return;}
  var d=dealOf(dealId);
  var o=Repo.insert('offers',{deal_id:dealId,mandate_id:d.mandate_id,contact_id:d.contact_id,
    side:oDraft.side,amount:amt,note:val('ofn')||'',status:'مقدم',counter_of:counterOf||null,by:Session.user.id});
  if(counterOf&&Repo.find('offers',counterOf).status==='مقدم')Repo.update('offers',counterOf,{status:'مضاد'});
  logAct('deal',dealId,'offer','عرض سعر '+M(amt)+' من '+(oDraft.side==='client'?'العميل':'المالك'),'Offer '+amt);
  advance(dealId,counterOf?'تفاوض':'عرض سعر');
  closeSheet();dealSheet(dealId);toast(L('سُجّل العرض','Offer recorded'));
}
function respondOffer(id,st){
  var o=Repo.find('offers',id),d=dealOf(o.deal_id);
  if(st==='مضاد')return offerSheet(o.deal_id,id);
  Repo.update('offers',id,{status:st,answered_at:nowISO(),answered_by:Session.user.id});
  logAct('deal',o.deal_id,'offer_'+st,'العرض '+M(o.amount)+' — '+st,'Offer '+st);
  if(st==='مقبول'){
    Repo.update('deals',o.deal_id,{value:o.amount,agreed:o.amount,agreed_at:nowISO()});
    advance(o.deal_id,'اتفاق');
    notify('اتُّفق على '+M(o.amount)+' — جهّز العقد','Agreed at '+M(o.amount)+' — prepare the contract','alert');
  }
  closeSheet();dealSheet(o.deal_id);toast(st);
}

/* ── العمولة: قيود منفصلة لكل مستفيد، لا رقم واحد مجمّع ────────── */
function comRate(purpose){
  var o=Repo.find('offices',Session.office.id)||{};
  return purpose==='بيع'?(o.rate_sale===undefined?2.5:o.rate_sale):(o.rate_rent===undefined?2.5:o.rate_rent);
}
function postCommission(dealId){
  var d=dealOf(dealId),m=Repo.find('mandates',d.mandate_id),c=contactOf(d.contact_id);
  var rate=comRate(d.purpose),gross=Math.round(d.value*rate/100);
  if(!gross)return [];
  var rows=[{who:L('المكتب','Office'),kind:'gross',beneficiary:d.owner_user,basis:d.value,rate:rate,
    amount:gross,reason:'عمولة '+(d.purpose||'')+' — '+c.name_ar,deal_id:dealId}];
  /* عقار مكتب شريك: m.split هو حصتنا، والباقي لهم */
  if(m&&m.source==='partner'&&m.split){
    var ps=Math.round(gross*(100-m.split)/100);
    if(ps>0)rows.push({who:m.partner||L('مكتب شريك','Partner office'),kind:'partner',beneficiary:null,
      basis:gross,rate:100-m.split,amount:-ps,reason:'حصة المكتب الشريك — '+(m.partner||''),deal_id:dealId});
  }
  /* مكتب تعاون طلب عميلنا أو عرضنا */
  var cb=d.collab_id?Repo.find('collabs',d.collab_id):null;
  if(cb&&cb.split){
    var cs=Math.round(gross*cb.split/100);
    if(cs>0)rows.push({who:cb.from,kind:'collab',beneficiary:null,basis:gross,rate:cb.split,
      amount:-cs,reason:'حصة تعاون — '+cb.from,deal_id:dealId});
  }
  /* مسوّق متعاون */
  if(d.marketer_id){
    var mk=Repo.where('marketers',function(x){return x.user_id===d.marketer_id;})[0];
    if(mk&&mk.share){var ms=Math.round(gross*mk.share/100);
      if(ms>0)rows.push({who:userName(d.marketer_id),kind:'marketer',beneficiary:d.marketer_id,basis:gross,
        rate:mk.share,amount:-ms,reason:'حصة المسوّق — '+userName(d.marketer_id),deal_id:dealId});}
  }
  rows.forEach(function(r){Repo.insert('commissions',r);});
  return rows;
}
function dealCommissions(id){return Repo.where('commissions',function(x){return x.deal_id===id;});}
function netOf(rows){return rows.reduce(function(s,x){return s+x.amount;},0);}

/* ── العقد: إنشاء، جدول دفعات، تجديد، انتهاء ─────────────────── */
var FREQ=[['سنوي','Annual',1],['نصف سنوي','Semi-annual',2],['ربع سنوي','Quarterly',4],['شهري','Monthly',12]];
var PAYWAYS={
  rent:[['شهري','Monthly'],['ربع سنوي','Quarterly'],['نصف سنوي','Semi-annual'],['سنوي','Annual']],
  sale:[['دفعة واحدة','One payment'],['دفعتين','Two payments'],['أكثر من دفعتين','More than two'],['تمويل عقاري','Mortgage']]};
/* ما قاله العميل عن سداده يصير الافتراضي في عقده — وإلا سُئل مرتين وأُجيب مرة */
function payPrefOf(contactId,purpose){
  var rs=Repo.where('requirements',function(r){
    return r.contact_id===contactId&&r.purpose===purpose&&r.pay_pref;});
  return rs.length?rs[rs.length-1].pay_pref:null;
}
function freqN(f){var r=FREQ.filter(function(x){return x[0]===f;})[0];return r?r[2]:4;}
var ctDraft={kind:'إيجار',freq:'ربع سنوي'};

function contractSheet(dealId){
  var d=dealOf(dealId); if(!d)return;
  var m=Repo.find('mandates',d.mandate_id),c=contactOf(d.contact_id);
  var pref=payPrefOf(d.contact_id,d.purpose);
  if(!ctDraft.deal||ctDraft.deal!==dealId)
    ctDraft={deal:dealId,kind:d.purpose==='بيع'?'بيع':'إيجار',
      freq:(pref&&FREQ.some(function(f){return f[0]===pref;}))?pref:'ربع سنوي',pref:pref};
  var rent=ctDraft.kind!=='بيع';
  sheet('<h3>'+L('إنشاء العقد','Create the contract')+'</h3>'+
  '<div class="sub">'+esc(c.name_ar)+' · '+(m?mandateTitle(m):'')+'</div>'+
  '<div class="f"><label>'+L('نوع العقد','Contract type')+'</label><div class="pick">'+
  [['إيجار',L('إيجار','Lease')],['بيع',L('بيع','Sale')]].map(function(x){
    return '<button class="pk '+(ctDraft.kind===x[0]?'on':'')+'" onclick="ctDraft.kind=\''+x[0]+'\';contractSheet(\''+dealId+'\')">'+x[1]+'</button>';}).join('')+'</div></div>'+
  '<div class="two"><div class="f"><label>'+L('البداية','Start')+'</label><input id="ctst" type="date" value="'+todayStr()+'"></div>'+
  '<div class="f"><label>'+(rent?L('المدة (شهرًا)','Term (months)'):L('مدة السداد (شهرًا)','Payment term (months)'))+
  '</label><input id="ctmo" type="number" value="'+(rent?12:1)+'"></div></div>'+

function createContract(dealId){
  var d=dealOf(dealId),m=Repo.find('mandates',d.mandate_id);
  var kind=ctDraft.kind,rent=kind!=='بيع';
  var start=val('ctst')||todayStr(),months=+val('ctmo')||(rent?12:1),total=+val('cttot')||d.value;
  if(!total){toast(L('أدخل قيمة العقد','Enter the contract value'));return;}
  var yr=new Date().getFullYear();
  var no=(rent?'L-':'S-')+yr+'-'+String(Repo.all('contracts').length+101);
  var ct=Repo.insert('contracts',{no:no,kind:kind,deal_id:dealId,mandate_id:d.mandate_id,
    asset_id:m?m.asset_id:null,contact_id:d.contact_id,start:start,end:addMonths(start,months),
    total:total,freq:rent?ctDraft.freq:'—',status:'نشط'});
  if(rent){
    var n=Math.max(1,Math.round(months/12*freqN(ctDraft.freq))),each=Math.round(total/n);
    for(var i=0;i<n;i++)Repo.insert('payments',{contract_id:ct.id,no:i+1,kind:'إيجار',
      due:addMonths(start,Math.round(i*months/n)),amount:i===n-1?total-each*(n-1):each,paid:0});
  }else{
    var dep=+val('ctdep')||0;
    if(dep>0&&dep<total){
      Repo.insert('payments',{contract_id:ct.id,no:1,kind:'عربون',due:start,amount:dep,paid:0});
      Repo.insert('payments',{contract_id:ct.id,no:2,kind:'باقي الثمن',due:addMonths(start,months),amount:total-dep,paid:0});
    }else Repo.insert('payments',{contract_id:ct.id,no:1,kind:'ثمن البيع',due:addMonths(start,months),amount:total,paid:0});
  }
  if(m)setState(m.id,rent?'مؤجر':'مباع',no);
  var c=Repo.find('contacts',d.contact_id);
  if(c&&c.role==='باحث')Repo.update('contacts',c.id,{role:rent?'مستأجر':'مشترٍ'});
  advance(dealId,'عقد');
  Repo.insert('tasks',{title_ar:'متابعة بداية العقد '+no,due:addMonths(start,0),
    assigned_to:d.owner_user||Session.user.id,status:'open',entity:'contract',entity_id:ct.id});
  logAct('contract',ct.id,'activated','فُعِّل العقد '+no+' وتوّلد جدول الدفعات','Contract '+no+' activated');
  notify('عقد جديد '+no+' — يبدأ التحصيل','New contract '+no+' — collection starts','info');
  runChecks();
  closeSheet();go('money',1);toast(L('فُعِّل العقد وتوّلدت الدفعات','Contract activated, schedule generated'));
}
function contractPayments(ctId){return Repo.where('payments',function(p){return p.contract_id===ctId;})
  .sort(function(a,b){return a.no-b.no;});}
function ctCollected(ctId){return contractPayments(ctId).reduce(function(s,p){return s+(p.paid||0);},0);}
function ctArrears(ctId){return contractPayments(ctId).reduce(function(s,p){

function doRenew(ctId){
  var old=Repo.find('contracts',ctId);
  var start=val('rnst')||todayStr(),months=+val('rnmo')||12,total=+val('rntot')||old.total,rate=+val('rnrate')||0;
  var no=old.no+'-R'+String((old.renew_gen||0)+1);
  var ct=Repo.insert('contracts',{no:no,kind:old.kind,deal_id:old.deal_id,mandate_id:old.mandate_id,
    asset_id:old.asset_id,contact_id:old.contact_id,start:start,end:addMonths(start,months),
    total:total,freq:old.freq,status:'نشط',renewed_from:ctId,renew_gen:(old.renew_gen||0)+1});
  var n=Math.max(1,Math.round(months/12*freqN(old.freq))),each=Math.round(total/n);
  for(var i=0;i<n;i++)Repo.insert('payments',{contract_id:ct.id,no:i+1,kind:'إيجار',
    due:addMonths(start,Math.round(i*months/n)),amount:i===n-1?total-each*(n-1):each,paid:0});
  Repo.update('contracts',ctId,{status:'مجدد',renewed_to:ct.id,ended_at:nowISO()});
  if(rate>0)Repo.insert('commissions',{who:L('المكتب','Office'),kind:'renewal',beneficiary:Session.user.id,
    basis:total,rate:rate,amount:Math.round(total*rate/100),reason:'عمولة تجديد — '+no,contract_id:ct.id});
  logAct('contract',ct.id,'renewed','تجديد العقد '+old.no+' ← '+no,'Renewed '+old.no+' → '+no);
  notify('جُدّد العقد '+no,'Contract renewed '+no,'info');

function savePay(id){
  if(!guard('payment.record')&&!guard('payment.*'))return;
  var p=Repo.find('payments',id),amt=+val('pya');
  if(!amt||amt<=0){toast(L('أدخل المبلغ','Enter an amount'));return;}
  var paid=Math.min(p.amount,(p.paid||0)+amt),full=paid>=p.amount;
  Repo.update('payments',id,{paid:paid,method:pyM,last_paid_at:nowISO(),
    paid_at:full?nowISO():null,receipt:'R-'+new Date().getFullYear()+'-'+String(Repo.all('payments').filter(function(x){return x.paid;}).length+1)});
  var ct=Repo.find('contracts',p.contract_id),c=contactOf(ct.contact_id);
  logAct('payment',id,'recorded','سداد '+M(amt)+' على العقد '+ct.no+(full?' — مكتمل':' — جزئي'),'Payment '+amt);
  if(!full)notify('سداد جزئي على '+ct.no+' — متبقٍ '+M(payRemain(Repo.find('payments',id))),
    'Partial payment on '+ct.no,'alert');
  var tx=full?('تم استلام السداد كاملًا\nرقم العقد: '+ct.no+'\nالدفعة: '+p.no+'\nالمبلغ: '+M(paid)+' ريال\nشكرًا لالتزامكم\n'+Session.office.name_ar)
    :('تم استلام دفعة جزئية\nرقم العقد: '+ct.no+'\nالمستلم: '+M(amt)+' ريال\nالمتبقي: '+M(p.amount-paid)+' ريال\n'+Session.office.name_ar);
  runChecks();render();
  sheet('<h3>'+(full?L('سُجّل السداد كاملًا','Paid in full'):L('سُجّل سداد جزئي','Partial payment'))+'</h3>'+
  '<div class="sub">'+L('التأكيد يُرسل بنص معتمد فقط','Confirmation uses approved wording only')+'</div>'+
  '<div class="bubble">'+esc(tx)+'</div>'+

  '<button class="btn g" onclick="closeSheet()">'+t('close')+'</button>');
}

/* كشف حساب المالك — دفتر لا يُعدَّل: استحقاق ثم سداد */
function assetContracts(assetId){return Repo.where('contracts',function(c){return c.asset_id===assetId;});}
function ownerBook(assetId){
  var m=Repo.where('mandates',function(x){return x.asset_id===assetId&&x.purpose==='إدارة أملاك';})[0];
  var fee=m&&m.mgmt_fee!==undefined?m.mgmt_fee:5;
  var collected=0;
  assetContracts(assetId).forEach(function(c){collected+=ctCollected(c.id);});
  var exp=expensesOf(assetId).filter(function(x){return x.payer==='المالك';})
    .reduce(function(s,x){return s+x.amount;},0);
  var mgmt=Math.round(collected*fee/100);
  var earned=collected-exp-mgmt;
  var book=Repo.where('settlements',function(s){return s.asset_id===assetId;});
  var issued=book.filter(function(s){return s.type==='استحقاق';}).reduce(function(s,x){return s+x.amount;},0);
  var paid=book.filter(function(s){return s.type==='سداد';}).reduce(function(s,x){return s+x.amount;},0);
  return {mandate:m,fee:fee,collected:collected,expenses:exp,mgmt:mgmt,earned:earned,
    issued:issued,paid:paid,unissued:earned-issued,balance:issued-paid,book:book};
}
function ownerStatement(assetId){
  var b=ownerBook(assetId),a=Repo.find('assets',assetId)||{},o=contactOf(a.owner_id);
  var lines=['كشف حساب مالك',(a.type||'')+' — '+(a.hood||''),'',
    'إجمالي المحصَّل: '+M(b.collected)+' ريال',
    'مصروفات على المالك: '+M(b.expenses)+' ريال',
    'أتعاب الإدارة ('+b.fee+'%): '+M(b.mgmt)+' ريال','',
    'صافي المستحق للمالك: '+M(b.earned)+' ريال',
    'سبق تحويله: '+M(b.paid)+' ريال',
    'الرصيد القائم: '+M(b.earned-b.paid)+' ريال','',Session.office.name_ar];
  var tx=lines.join('\n');
  logAct('asset',assetId,'statement','كشف حساب للمالك '+o.name_ar,'Owner statement prepared');
  sheet('<h3>'+L('كشف حساب المالك','Owner statement')+'</h3><div class="sub">'+esc(o.name_ar)+'</div>'+
  '<div class="bubble">'+esc(tx)+'</div>'+
  '<div class="note" style="margin-top:11px">'+L('الكشف قيد لا يُعدَّل — التصحيح بقيد جديد، تمامًا كسجل العمولات.',
   'A statement is an entry, not a field: corrections are new entries, exactly like the commission ledger.')+'</div>'+

function shrink(file,cb){
  if(String(file.type).indexOf('image')!==0){
    if(file.size>900*1024){toast(L('الملف كبير — أقصى ٩٠٠ كيلوبايت','File too large — 900 KB max'));return;}
    var r0=new FileReader();r0.onload=function(ev){cb(ev.target.result);};r0.readAsDataURL(file);return;}
  var r=new FileReader();
  r.onload=function(ev){var img=new Image();
    img.onload=function(){var max=1100,s=Math.min(1,max/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',0.72));};
    img.onerror=function(){cb(ev.target.result);};
    img.src=ev.target.result;};
  r.readAsDataURL(file);
}
function pickDoc(input,e,id){
  var f=input.files&&input.files[0]; if(!f)return;
  shrink(f,function(data){
    var d=Repo.insert('documents',{entity:e,entity_id:id,name:f.name,kind:dDraft.kind,
      mime:f.type,size:Math.round(data.length*0.75),data:data,by:Session.user.id});
    if(e==='asset'){var a=Repo.find('assets',id);
      if(a&&String(f.type).indexOf('image')===0){var ph=(a.photos||[]).slice();ph.push(data);
        Repo.update('assets',id,{photos:ph,photo:a.photo||data});}}
    logAct(e,id,'document','أُرفق مستند: '+f.name,'Document attached');
    docSheet(e,id);toast(t('saved'));
  });
}
function openDoc(id){var d=Repo.find('documents',id);var w=window.open();

function delDoc(id,e,eid){Repo.remove('documents',id);logAct(e,eid,'document_removed','حُذف مستند','Document removed');docSheet(e,eid);}

function pushNotif(key,ar,en,kind){

  DB.notifications.push({id:uid(),office_id:Session.office&&Session.office.id,key:key,
    text_ar:ar,text_en:en||ar,kind:kind||'info',read:false,created_at:nowISO()});
  return true;
}
function pushTask(key,title,due,who,entity,eid){
  if(Repo.where('tasks',function(x){return x.key===key;}).length)return;
  DB.tasks.push({id:uid(),office_id:Session.office&&Session.office.id,key:key,title_ar:title,
    due:due,assigned_to:who||(Session.user&&Session.user.id),status:'open',
    entity:entity,entity_id:eid,created_at:nowISO()});
}
function runChecks(){
  if(!Session.user||!Session.office)return;
  var wk=weekKey();
  /* متأخرات */
  Repo.all('payments').forEach(function(p){
    if(payState(p)!=='متأخر')return;
    var ct=Repo.find('contracts',p.contract_id); if(!ct)return;
    var c=contactOf(ct.contact_id);
    pushNotif('pay:'+p.id+':'+wk,'متأخر: '+c.name_ar+' — '+M(payRemain(p))+' ريال على '+ct.no,
      'Overdue: '+M(payRemain(p))+' on '+ct.no,'alert');
  });
  /* الرخصة نفسها: تنبيه مبكر، فالتجديد لا يتم في يوم */
  (function(){
    var o=Repo.find('offices',Session.office.id)||{};
    if(!o.fal_expiry)return;
    var left=daysBetween(o.fal_expiry,new Date());
    if(left<0)pushNotif('falx:'+o.fal_expiry,
      'انتهت رخصة فال — النشاط متوقف نظاميًا حتى التجديد','FAL licence has expired','alert');
    else if(left<=60)pushNotif('fal60:'+o.fal_expiry+':'+wk,
      'رخصة فال تنتهي بعد '+left+' يومًا — ابدأ التجديد','FAL expires in '+left+' days','alert');
  })();
  /* التفويض: ينتهي كما تنتهي الرخصة، والتسويق بعده بلا سند */
  Repo.where('mandates',function(m){
    return m.status==='معتمد'&&mState(m)==='متاح'&&!isMarket(m)&&m.source!=='partner';
  }).forEach(function(m){
    var au=authOf(m);
    if(!au)pushNotif('nau:'+m.id,'بلا تفويض — '+mandateTitle(m)+' لا يُسوَّق حتى يأذن مالكه',
      'No authorization on file','alert');
    else if(au.left<0)pushNotif('aux:'+m.id+':'+au.end,
      'انتهى تفويض '+mandateTitle(m)+' — جدّده أو اسحب العرض','Authorization expired','alert');
    else if(au.left<=14)pushNotif('au14:'+m.id+':'+wk,
      'تفويض '+mandateTitle(m)+' ينتهي بعد '+au.left+' يومًا','Authorization expiring','alert');
  });
  /* رخص الإعلان لكل عقار منشور */
  Repo.where('mandates',function(m){
    var l=adLic(m);return (m.channels||[]).length&&l&&l.exp;}).forEach(function(m){
    var lf=daysBetween(adLic(m).exp,new Date());
    if(lf<0)pushNotif('adx:'+m.id+':'+m.ad_expiry,
      'رخصة إعلان منتهية — '+mandateTitle(m)+' منشور بلا رخصة سارية',
      'Advertising licence expired while the listing is live','alert');
    else if(lf<=14)pushNotif('ad14:'+m.id+':'+wk,
      'رخصة إعلان '+mandateTitle(m)+' تنتهي بعد '+lf+' يومًا','Ad licence expiring','alert');
  });
  /* عقود على وشك الانتهاء */
  Repo.where('contracts',function(c){return c.status==='نشط';}).forEach(function(ct){
    var dl=daysLeft(ct);
    if(dl<0){pushNotif('exp:'+ct.id,'انتهت مدة العقد '+ct.no+' — جدّده أو أنهه',
      'Contract '+ct.no+' term has ended','alert');return;}
    if(dl<=60)pushNotif('exp60:'+ct.id,'العقد '+ct.no+' ينتهي بعد '+dl+' يومًا — ابدأ التجديد',
      'Contract '+ct.no+' expires in '+dl+' days','alert');
    if(dl<=60)pushTask('exp60t:'+ct.id,'التفاوض على تجديد العقد '+ct.no,addMonths(ct.end,-2),null,'contract',ct.id);
  });
  /* معاينات الغد */
  Repo.where('viewings',function(v){return v.status==='مجدولة';}).forEach(function(v){
    var h=(new Date(v.when)-new Date())/36e5;
    if(h>0&&h<=24){var m=Repo.find('mandates',v.mandate_id);
      pushNotif('vw:'+v.id,'معاينة خلال ٢٤ ساعة — '+(m?mandateTitle(m):''),'Viewing within 24h','alert');
      if(!v.reminded_at)pushTask('vwr:'+v.id,'تذكير العميل بموعد المعاينة',
        todayStr(),v.by,'viewing',v.id);}
    if(h<0)pushTask('vwt:'+v.id,'تسجيل نتيجة المعاينة',todayStr(),v.by,'viewing',v.id);
  });
  /* وعود تجاوزت المهلة */
  Repo.where('requirements',function(r){return r.status==='active';}).forEach(function(r){
    if(slaState(r)==='breached')pushNotif('sla:'+r.id+':'+wk,
      'تجاوز مهلة الرد — '+contactOf(r.contact_id).name_ar,'Reply window breached','alert');
  });
  /* البيانات المعرّضة للضياع — التنبيه يتناسب مع حجمها لا مع مرور الوقت */
  (function(){
    var pend=sinceBackup(),lb=stg().last_backup;
    if(pend>=15||(pend>0&&(!lb||daysBetween(new Date(),lb)>=14)))
      pushNotif('bk:'+wk,'مضى '+pend+' سجلًا بلا نسخة احتياطية — نزّل نسخة الآن',
        pend+' records since the last backup','alert');
  })();
  /* مستحقات مالك لم تُصرف */
  managedMandates().forEach(function(m){
    var b=ownerBook(m.asset_id);
    if(b.earned-b.paid>0)pushNotif('own:'+m.asset_id+':'+wk,
      'مستحق للمالك '+M(b.earned-b.paid)+' ريال — جهّز الكشف','Owner dues pending','info');
  });
  Repo.flush();
}

/* ════════════════════════════════════════════════════════════════
   11C · التشغيل الأول والجاهزية
   لا يُسلَّم مكتب حقيقي نظامًا فيه عملاء وهميون. وقبل أول عميل
   هناك ما لا يكفي فيه الكود: أرقام وتراخيص ونسخة احتياطية.
   ════════════════════════════════════════════════════════════════ */
var SHORT_FALLBACK='بناء الشرق';
/* الشعار يحمل اسم المنشأة لا رمزًا لا يعرفه أحد. والاسم النظامي طويل،
   فيُختصر للعرض ويبقى كاملًا في التقارير والرسائل الرسمية. */
function shortName(){
  var o=(Session.office&&Repo.find('offices',Session.office.id))||Repo.all('offices')[0];
  var n=(o&&(LANG==='en'?(o.name_en||o.name_ar):o.name_ar))||SHORT_FALLBACK;
  n=String(n).replace(/^مؤسسة\s+/,'').replace(/^شركة\s+/,'').replace(/^مكتب\s+/,'')
             .replace(/\s+للخدمات العقارية$/,'').replace(/\s+العقارية$/,'')
             .replace(/\s+Real Estate$/i,'').trim();
  if(n.length<=14)return n;
  /* القطع عند الكلمة لا عند الحرف — «بناء الشرق» أوقع من «بناء الشرق الم…» */
  var w=n.split(/\s+/),out=w[0];
  for(var i=1;i<w.length;i++){
    if((out+' '+w[i]).length>14)break;
    out+=' '+w[i];
  }
  return out;
}
/* التطبيع: الوسيط يكتب «احمد» ويبحث عن «أحمد»، ويكتب الرقم بلا صفر.
   بحثٌ لا يجد ما هو موجود أسوأ من غياب البحث، لأنه يُكذّب الذاكرة. */
function norm(x){
  return String(x||'').toLowerCase()
    .replace(/[\u0623\u0625\u0622\u0671]/g,'\u0627')   /* أ إ آ ← ا */
    .replace(/\u0649/g,'\u064a')                        /* ى ← ي */
    .replace(/\u0629/g,'\u0647')                        /* ة ← ه */
    .replace(/[\u064b-\u0652\u0640]/g,'')               /* تشكيل وتطويل */
    .replace(/[^\w\u0600-\u06ff]+/g,' ')
    .trim();
}
function digits(x){return String(x||'').replace(/\D/g,'');}

/* كل نتيجة تحمل: ماذا وجدنا، ولماذا طابق، وأين يذهب الوسيط */
function searchAll(q){
  var s0=norm(q),d0=digits(q),out=[];
  if(s0.length<2&&d0.length<3)return out;
  function hit(hay){ return s0 && norm(hay).indexOf(s0)>-1; }
  function num(hay){ return d0.length>=3 && digits(hay).indexOf(d0)>-1; }

  Repo.all('contacts').forEach(function(c){
    var why = hit(c.name_ar)?'الاسم' : (num(c.phone)?'الجوال':null);
    if(!why)return;
    out.push({k:'contact',t:c.name_ar,s:(c.role||'')+' · '+(c.phone||''),
      why:why,go:function(){closeSheet();contactSheet(c.id);}});
  });

  Repo.all('mandates').forEach(function(m){
    var a=asset(m); if(!a)return;
    var why = hit(a.hood)?'الحي' : hit(a.type)?'النوع' : (a.desc&&hit(a.desc))?'وصف الوحدة'
            : (a.city&&hit(a.city))?'المدينة'
            : num(m.price)?'السعر'
            : (m.ad_licence&&num(m.ad_licence))?'الترخيص الإعلاني'
            : (m.auth&&m.auth.official&&num(m.auth.official))?'عقد الوساطة'
            : null;
    if(!why)return;
    out.push({k:'mandate',t:mandateTitle(m),s:M(m.price)+' · '+mState(m),
      why:why,go:function(){closeSheet();go('props',0);}});
  });

  Repo.all('contracts').forEach(function(ct){
    var why = num(ct.no)||hit(ct.no)?'رقم العقد'
            : num(ct.total)?'قيمة العقد' : null;
    if(!why)return;
    out.push({k:'contract',t:ct.no,s:contactOf(ct.contact_id).name_ar+' · '+M(ct.total),
      why:why,go:function(){closeSheet();go('money',1);}});
  });

  Repo.all('requirements').forEach(function(r){
    var c=contactOf(r.contact_id);
    var why = (d0.length>=3&&digits(reqRef(r)).indexOf(d0)>-1)?'مرجع الطلب'
            : hit(c.name_ar)?'اسم العميل' : null;
    if(!why)return;
    out.push({k:'req',t:c.name_ar+' · '+reqRef(r),
      s:(r.purpose||'')+' · '+M(r.min)+'–'+M(r.max),
      why:why,go:function(){closeSheet();clientReport(r.id);}});
  });

  Repo.all('deals').forEach(function(d){
    var c=contactOf(d.contact_id);
    if(!hit(c.name_ar)&&!num(d.value))return;
    out.push({k:'deal',t:c.name_ar,s:(d.stage||'')+' · '+M(d.value),
      why:hit(c.name_ar)?'اسم العميل':'قيمة الصفقة',
      go:function(){closeSheet();go('deals');dealSheet(d.id);}});
  });

  Repo.all('requirements').forEach(function(r){
    var c=contactOf(r.contact_id);
    var why = hit(c.name_ar)?'اسم العميل'
            : (r.hoods||[]).some(hit)?'الحي'
            : (r.types||[]).some(hit)?'النوع' : null;
    if(!why)return;
    out.push({k:'req',t:c.name_ar,s:r.purpose+' · '+M(r.min)+'–'+M(r.max),
      why:why,go:function(){closeSheet();clientReport(r.id);}});
  });

  return out.slice(0,40);
}
var SQ='';

    L('طابق في: ','matched on: ')+esc(x.why)+'</div></div>'+

/* البطاقة تُبنى من بيانات العقار وحدها. بيانات المالك لا تدخلها
   أبدًا — لا اسمه ولا رقمه ولا حتى إشارة إليه. */
function cardText(mid,rid){
  var m=Repo.find('mandates',mid),a=asset(m),o=Session.office;
  var r=rid?Repo.find('requirements',rid):null;
  var C=[];
  C.push(unitName(a)+' لل'+(m.purpose==='بيع'?'بيع':'إيجار')+' — '+a.hood+(a.city?'، '+a.city:''));
  C.push('المرجع: '+refOf(m));
  C.push('');
  if(a.area)C.push('· المساحة: '+M(a.area)+' م²');

/* CSV بالعربية يفتحه إكسل مقلوبًا ما لم يبدأ بعلامة الترتيب.
   ملف يفتح مشوَّهًا لا يُستخدم مرتين. */
function csvCell(v){
  var x=String(v===undefined||v===null?'':v);
  return /[",\n;]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x;
}
function csvOf(head,rows){
  var out=[head.map(csvCell).join(',')];
  rows.forEach(function(r){out.push(r.map(csvCell).join(','));});
  return '\ufeff'+out.join('\r\n');          /* BOM ليقرأها إكسل عربيةً */
}
function monthKey(iso){return String(iso||'').slice(0,7);}
function inMonth(iso,mk){return !mk||monthKey(iso)===mk;}

/* ثلاثة ملفات لثلاثة أسئلة: ماذا كسبنا، وماذا حُصّل، وماذا للمالك */
function expCommissions(mk){
  var rows=Repo.all('commissions').filter(function(x){return inMonth(x.created_at,mk);})
   .map(function(x){

    return [dstr(x.created_at), x.kind, x.who,
      d?contactOf(d.contact_id).name_ar:'', d?d.purpose:'',
      x.basis||'', x.rate||'', x.amount, x.reason||''];
  });
  return csvOf(['التاريخ','النوع','الجهة','العميل','الغرض','الأساس','النسبة%','المبلغ','البيان'],rows);
}
function expPayments(mk){
  var rows=[];
  Repo.all('payments').forEach(function(p){
    if(!inMonth(p.due,mk)&&!inMonth(p.paid_at,mk))return;
    var ct=Repo.find('contracts',p.contract_id); if(!ct)return;
    var a=Repo.find('assets',ct.asset_id)||{};
    rows.push([ct.no, contactOf(ct.contact_id).name_ar,
      (a.type||'')+' '+(a.hood||''), p.no, p.kind||'',
      p.due, p.amount, p.paid||0, payRemain(p), payState(p),
      p.paid_at?dstr(p.paid_at):'',
      docsOf('payment',p.id).length?'نعم':'لا']);
  });
  return csvOf(['رقم العقد','المستأجر','العقار','الدفعة','النوع','الاستحقاق',
    'المبلغ','المدفوع','المتبقي','الحالة','تاريخ السداد','إيصال'],rows);
}
function expOwnerDues(mk){

      bk.collected,bk.expenses,bk.mgmt,bk.earned,bk.paid,bk.earned-bk.paid]);

  return csvOf(['المالك','العقار','المحصَّل','المصروفات','أتعاب الإدارة',

    document.body.appendChild(a); a.click(); document.body.removeChild(a);

/* «تقرير أسبوعي حتى لو لم يحدث شيء» هو الوعد المعلن على الصفحة.
   ووعدٌ لا يُقاس يُكسر في الأسبوع الثالث — فهنا يصير قابلًا للقياس. */
function weekStart(d){
  var x=new Date(d||new Date()),wd=(stg().week_day===undefined?0:stg().week_day);
  x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()-wd+7)%7));
  return x;
}
function sentThisWeek(iso){ return !!iso && new Date(iso)>=weekStart(); }

/* من ينتظر تقريرًا: كل مالك عرضه قائم، وكل عميل طلبه مفتوح */
function weekDue(){
  var out=[];
  Repo.where('mandates',function(m){
    return m.status==='معتمد'&&['مسحوب','مباع'].indexOf(mState(m))<0;
  }).forEach(function(m){
    var a=asset(m); if(!a||!a.owner_id)return;   /* عقار بلا مالك مسجَّل لا وعد عليه */
    out.push({kind:'owner',id:m.id,name:contactOf(a.owner_id).name_ar,
      sub:mandateTitle(m),at:m.report_at,n:m.reports_sent||0,
      done:sentThisWeek(m.report_at)});
  });
  Repo.where('requirements',function(r){return r.status==='active';}).forEach(function(r){
    out.push({kind:'client',id:r.id,name:contactOf(r.contact_id).name_ar,
      sub:(r.types||[]).join('، ')+' · '+M(r.min)+'–'+M(r.max),
      at:r.last_sent_at,n:r.sent||0,done:sentThisWeek(r.last_sent_at)});
  });
  out.sort(function(x,y){                        /* المتأخر أولًا، ومن لم يصله شيء قط قبله */
    if(x.done!==y.done)return x.done?1:-1;
    if(!x.at)return -1; if(!y.at)return 1;
    return new Date(x.at)-new Date(y.at);
  });
  return out;
}
function weekScore(){
  var d=weekDue(),done=d.filter(function(x){return x.done;}).length;
  return {total:d.length,done:done,left:d.length-done,rows:d};
}
/* سلسلة الأسابيع المكتملة — تُقرأ من السجل لا من ادّعاء */
function promiseStreak(){
  var weeks={};
  Repo.all('activity').forEach(function(a){
    if(a.action==='report_sent'||a.action==='owner_report_sent')
      weeks[+weekStart(a.created_at)]=1;
  });
  var n=0,w=+weekStart()-7*864e5;               /* الأسبوع الجاري لا يُحتسب حتى يكتمل */
  while(weeks[w]){n++;w-=7*864e5;}
  return n;
}

/* ملف يُنزَّل: النصّ المنسوخ يضيع بين المحادثات، والملف يبقى */
function downloadBackup(){
  var j=Repo.export();
  var name='EEC-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    var b=new Blob([j],{type:'application/json'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a');
    a.href=u; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    var t0=Repo.all('settings')[0];
    if(t0)Repo.update('settings',t0.id,{last_backup:nowISO()});
    logAct('office',Session.office.id,'backup','نُزّلت نسخة احتياطية '+name,'Backup downloaded');
    render();toast(L('نُزّل الملف — احفظه خارج الجهاز','Downloaded — keep it off this device'));
  }catch(e){
    toast(L('تعذّر التنزيل — استخدم النسخ اليدوي','Download failed — use manual copy'));
    takeBackup();
  }
}
function restoreFile(input){
  var f=input.files&&input.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(ev){
    try{
      var j=String(ev.target.result);
      var probe=JSON.parse(j);
      if(!probe.offices||!probe.users)throw new Error('bad');
      Repo.import(j);
      logAct('office',Session.office.id,'restore','استُعيدت نسخة من ملف','Restored from a file');
      render();toast(L('استُعيدت البيانات','Restored'));
    }catch(e){ toast(L('ملف غير صالح','That file is not a backup')); }
  };
  rd.readAsText(f);
}

/* ── لصق طلب من الموقع ─────────────────────────────────────────
   صفحة المكتب تبني رسالة واتساب بترتيب ثابت. هنا نعكس العملية:
   الوسيط ينسخ الرسالة كما هي فتتحول إلى عميل وطلب، أو مالك وعقار.
   لا خادم ولا واجهة برمجية — نص متفق عليه بين طرفين، وهذا يكفي.
──────────────────────────────────────────────────────────────── */
var pDraft=null;
function digits(x){ /* يقبل الأرقام العربية والفواصل */
  return String(x||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);})
    .replace(/[^\d]/g,'');
}
function parseIntake(txt){
  var out={},lines=String(txt||'').split(/\r?\n/);
  /* التوثيق إجراء نظامي لا بحث — يُفرز مبكرًا لئلا يدخل خط المطابقة */
  if(/توثيق_عقد|طلب توثيق عقد/.test(String(txt||'')))out.doc=true;
  lines.forEach(function(ln){
    var i=ln.indexOf(':'); if(i<0)i=ln.indexOf('：'); if(i<0)return;
    var k=ln.slice(0,i).trim(), v=ln.slice(i+1).trim();
    if(!k||!v)return;
    if(/الاسم/.test(k))out.name=v;
    else if(/الصفة/.test(k))out.role=/مالك/.test(v)?'مالك':'باحث';
    else if(/الغرض/.test(k))out.purpose=v;
    else if(/نوع العقد/.test(k))out.ctype=v;
    else if(/نوع/.test(k))out.type=v;
    else if(/وصف الوحدة/.test(k))out.desc=v;
    else if(/السداد|الشراء/.test(k))out.pay=v;
    else if(/المدينة/.test(k))out.city=v;
    else if(/الحي/.test(k))out.hood=v;
    else if(/الميزانية/.test(k)){
      var p=v.split(/[–—\-]|إلى/);
      out.min=+digits(p[0])||0; out.max=+digits(p[1])||0;
    }
    else if(/السعر/.test(k))out.price=+digits(v)||0;
    else if(/الغرف/.test(k))out.beds=+digits(v)||0;
    else if(/ملاحظة/.test(k))out.note=v;
    else if(/المرجع|رقم العقار/.test(k))out.ref=v;
    else if(/معاينة/.test(k))out.wantView=!/^(لا|no)/i.test(v);
    else if(/الموعد المفضل|الموعد المفضّل/.test(k))out.when=v;
    else if(/هاتف|جوال|رقم/.test(k))out.phone=digits(v);
  });
  /* الغرض بلغة الصفحة ← الغرض بلغة النظام */
  var g=out.purpose||'';
  out.sys = /شراء|بيع/.test(g)?'بيع' : /إدارة/.test(g)?'إدارة أملاك' : 'إيجار';
  /* النوع قد يأتي مختصرًا: «محل» بينما النظام يسميه «محل تجاري» */
  if(out.type){
    var hit=TYPES.filter(function(x){return x[0]===out.type;})[0];
    if(!hit)hit=TYPES.filter(function(x){return x[0].indexOf(out.type)===0||out.type.indexOf(x[0])===0;})[0];
    if(hit)out.type=hit[0];
  }
  if(!out.city&&out.hood)out.city=cityOfHood(out.hood);
  out.ok = out.doc ? !!out.ctype : !!(out.role&&out.type);
  return out;
}
