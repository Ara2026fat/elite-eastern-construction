<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EEC</title>
<style>
:root{
  --ink:#0C1A18;--jade:#0A4F45;--jade2:#0E6B5C;--saff:#B57A1E;--clay:#A63A26;
  --mineral:#EDF1F0;--white:#fff;--line:#DBE3E1;--muted:#5A6A68;--faint:#8E9C9A;
  --gold:#C9A227;
  --sans:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --dir:-1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--mineral);color:var(--ink);font-size:15px;line-height:1.65;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-appearance:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--white);color:var(--ink);-webkit-appearance:none}
input:focus,select:focus{outline:2px solid var(--jade);outline-offset:-1px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.app{width:100%;max-width:540px;min-height:100vh;position:relative;padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* ── header ── */
.hd{background:linear-gradient(165deg,var(--jade2),var(--jade));color:#fff;
  padding:12px 16px 0;padding-top:calc(12px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(12,26,24,.13)}
.hr{display:flex;align-items:center;gap:9px}
.lg{font-weight:800;font-size:14px;letter-spacing:.09em}
.lg i{font-style:normal;color:var(--gold)}
.sp{flex:1}
.pill{border:1px solid rgba(255,255,255,.32);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.g{background:rgba(201,162,39,.22);border-color:rgba(201,162,39,.45)}
.hd h1{font-size:20px;font-weight:700;margin-top:9px;letter-spacing:-.01em}
.hd .sub{font-size:12px;opacity:.68;margin-top:1px;margin-bottom:11px}

/* ── sub tabs ── */
.subs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:9px;margin:0 -16px;padding-inline:16px}
.subs::-webkit-scrollbar{display:none}
.sb{padding:7px 13px;border-radius:18px;font-size:12.5px;white-space:nowrap;flex:0 0 auto;
  background:rgba(255,255,255,.13);color:rgba(255,255,255,.8);transition:all .2s}
.sb.on{background:#fff;color:var(--jade);font-weight:700}
.sb b{font-size:10.5px;opacity:.7;margin-right:4px}

/* ── stage ── */
.stage{padding:14px 14px 20px;animation:in .26s cubic-bezier(.22,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateX(calc(16px * var(--dir)))}to{opacity:1;transform:none}}
.stage.up{animation:up .24s cubic-bezier(.22,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── bottom bar ── */
.bar{position:fixed;bottom:0;inset-inline:0;margin:0 auto;max-width:540px;z-index:40;
  background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);display:flex;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.bt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;color:var(--faint);min-width:0;position:relative;transition:color .2s}
.bt .i{font-size:19px;line-height:1;transition:transform .2s}
.bt .l{font-size:10px;font-weight:600;white-space:nowrap}
.bt.on{color:var(--jade)}
.bt.on .i{transform:translateY(-2px) scale(1.08)}
.bt .dot{position:absolute;top:2px;inset-inline-start:calc(50% + 8px);min-width:16px;height:16px;
  border-radius:9px;background:var(--clay);color:#fff;font-size:9.5px;font-weight:700;
  display:grid;place-items:center;padding:0 4px}

/* ── fab ── */
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-end:calc(50% - 250px);
  width:52px;height:52px;border-radius:17px;background:var(--ink);color:#fff;font-size:25px;
  display:grid;place-items:center;z-index:41;box-shadow:0 6px 20px rgba(12,26,24,.3);transition:transform .2s}
.fab:active{transform:scale(.92)}
@media(max-width:560px){.fab{inset-inline-end:18px}}

/* ── blocks ── */
.k{background:var(--white);border-radius:15px;padding:14px;margin-bottom:10px}
.sec{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 3px 8px;display:flex;align-items:baseline;gap:6px}
.sec b{font-size:11px;color:var(--faint);font-weight:600}

.hero{border-radius:16px;padding:15px;margin-bottom:10px;color:#fff;background:var(--ink)}
.hero.a{background:linear-gradient(155deg,#B84029,#8C2C1B)}
.hero.w{background:linear-gradient(155deg,#C48A24,#9A6612)}
.hero.g{background:linear-gradient(155deg,var(--jade2),var(--jade))}
.hero .t{font-size:12px;opacity:.75}
.hero .v{font-size:33px;font-weight:800;letter-spacing:-.035em;margin-top:1px;line-height:1.1}
.hero .v small{font-size:12px;font-weight:500;opacity:.6;margin-inline-start:5px}
.hero .f{font-size:12px;opacity:.75;margin-top:7px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.m{background:var(--white);border-radius:13px;padding:12px}
.m .t{font-size:11px;color:var(--muted)}
.m .v{font-size:21px;font-weight:800;margin-top:1px;letter-spacing:-.02em}
.m.a .v{color:var(--clay)}.m.w .v{color:var(--saff)}.m.g .v{color:var(--jade)}

.r{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--white);border-radius:14px;margin-bottom:8px;width:100%;text-align:start;transition:transform .15s}
.r:active{transform:scale(.985)}
.r.top{align-items:flex-start}
.ic{width:38px;height:38px;border-radius:12px;background:var(--mineral);display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--muted);flex:0 0 auto}
.ic.a{background:#F8E7E3;color:var(--clay)}.ic.w{background:#FAF0DC;color:var(--saff)}
.ic.g{background:#E2EEEB;color:var(--jade)}
.rm{flex:1;min-width:0}
.rt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{text-align:end;flex:0 0 auto}
.rn{font-weight:800;font-size:15px;letter-spacing:-.02em}

.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;display:inline-block}
.t-g{background:#E2EEEB;color:var(--jade)}.t-w{background:#FAF0DC;color:#8A5D12}
.t-a{background:#F8E7E3;color:var(--clay)}.t-n{background:var(--mineral);color:var(--muted)}
.t-o{background:#0C1A18;color:var(--gold)}

.bars{height:4px;background:var(--mineral);border-radius:3px;overflow:hidden;margin-top:7px}
.bars i{display:block;height:100%;border-radius:3px;background:var(--jade);transition:width .4s}
.bars.w i{background:var(--saff)}.bars.a i{background:var(--clay)}

/* property */
.p{background:var(--white);border-radius:15px;overflow:hidden;margin-bottom:10px}
.p-i{height:112px;background:linear-gradient(140deg,#D9E5E2,#EFF3F2);display:grid;place-items:center;font-size:30px;position:relative;background-size:cover;background-position:center}
.p-i .tag{position:absolute;top:8px;inset-inline-start:8px}
.p-b{padding:11px 13px}
.p-t{font-weight:700;font-size:14.5px}
.p-l{font-size:12px;color:var(--muted);margin-bottom:7px}
.p-p{font-size:19px;font-weight:800;letter-spacing:-.025em}
.p-p small{font-size:10.5px;font-weight:500;color:var(--faint);margin-inline-start:3px}
.p-m{display:flex;gap:11px;font-size:11.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.p-m b{font-weight:700;color:var(--ink)}

/* board */
.board{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin:0 -14px;padding-inline:14px}
.board::-webkit-scrollbar{display:none}
.col{flex:0 0 158px}
.ch{font-size:11.5px;font-weight:700;color:var(--muted);padding:0 3px 6px;display:flex;justify-content:space-between}
.dc{background:var(--white);border-radius:12px;padding:10px;margin-bottom:6px;width:100%;text-align:start}
.dc.st{border-inline-start:3px solid var(--saff)}
.dc .t{font-weight:700;font-size:13px}
.dc .s{font-size:11px;color:var(--muted)}
.dc .v{font-weight:800;font-size:13px;margin-top:4px}

/* launcher */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--white);border-radius:15px;padding:14px;text-align:start;position:relative;overflow:hidden}
.tile .i{width:36px;height:36px;border-radius:11px;background:var(--mineral);display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.tile .t{font-weight:700;font-size:14px}
.tile .d{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:1px}
.tile .n{position:absolute;top:12px;inset-inline-start:12px;font-size:17px;font-weight:800;color:var(--jade)}
.tile.soon{opacity:.62}

/* forms */
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:5px;flex-wrap:wrap}
.pk{padding:8px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--white);color:var(--muted)}
.pk.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:700}
.pk.a.on{background:var(--clay);border-color:var(--clay)}
.photo{border:1.5px dashed var(--line);border-radius:13px;padding:18px;text-align:center;color:var(--faint);font-size:13.5px;background:var(--white);background-size:cover;background-position:center;min-height:96px;display:grid;place-items:center}
.photo.has{border-style:solid;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.65)}

.btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--jade);color:#fff;font-size:15.5px;font-weight:700;margin-top:10px}
.btn.o{background:var(--white);color:var(--jade);border:1.5px solid var(--jade)}
.btn.g{background:var(--mineral);color:var(--muted)}
.btn.d{background:var(--ink)}
.btn.s{padding:8px 12px;width:auto;font-size:12.5px;margin:0;border-radius:10px;display:inline-block}

.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:10.5px;padding:3px 8px;border-radius:7px;background:#E2EEEB;color:var(--jade);font-weight:600}
.chip.no{background:var(--mineral);color:var(--faint);text-decoration:line-through}
.sc{font-size:19px;font-weight:800;color:var(--jade)}

.empty{text-align:center;padding:30px 18px;color:var(--faint);font-size:13.5px;line-height:1.85}
.empty b{display:block;color:var(--muted);font-weight:700;font-size:14.5px;margin-bottom:4px}
.note{font-size:12px;background:#FCF9F0;border:1px solid #E9DFC3;border-radius:12px;padding:11px 13px;line-height:1.75;margin-bottom:12px;color:#6A5B26}
.bubble{background:#E2EEEB;border-radius:14px;border-start-end-radius:4px;padding:12px 14px;white-space:pre-line;font-size:13px;line-height:1.85;margin-top:9px}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}

/* sheet */
.sh{position:fixed;inset:0;background:rgba(12,26,24,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s;display:flex;align-items:flex-end;justify-content:center}
.sh.on{opacity:1;pointer-events:auto}
.sheet{background:var(--white);width:100%;max-width:540px;border-start-start-radius:22px;border-start-end-radius:22px;
  padding:6px 17px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.25,1)}
.sh.on .sheet{transform:none}
.grab{width:36px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 13px}
.sheet h3{font-size:17.5px;font-weight:800}
.sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}

.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));inset-inline:18px;max-width:480px;margin:0 auto;
  background:var(--ink);color:#fff;padding:12px 16px;border-radius:13px;font-size:14px;text-align:center;
  opacity:0;pointer-events:none;transition:all .25s;z-index:70;transform:translateY(8px)}
.toast.on{opacity:1;transform:none}
</style>
</head>

function wa(ph,t){var d=String(ph||'').replace(/\D/g,'');var e=d.charAt(0)==='0'?'966'+d.slice(1):d;
  return 'https://wa.me/'+e+(t?'?text='+encodeURIComponent(t):'');}
function send(ph,t){if(navigator.share)navigator.share({text:t}).catch(function(){});else location.href=wa(ph,t);}
function sheet(h){document.getElementById('sheet').innerHTML='<div class="grab"></div>'+h;document.getElementById('sh').className='sh on';}
function closeSheet(){document.getElementById('sh').className='sh';}
function live(){return P.filter(function(p){return p.status==='معتمد';});}
function vw(pid){return V.filter(function(v){return v.pid===pid&&v.status==='تمت';});}
function slaState(c){if(c.sent>0)return'answered';if(c.opened>24)return'breached';if(c.opened>17)return'risk';return'ok';}

function match(c){
  var out=[];
  live().forEach(function(p){
    if(p.purpose!==c.purpose)return;
    var ok=[],no=[],s=0;
    if(p.price>=c.min&&p.price<=c.max){s+=30;ok.push('الميزانية');}
    else if(p.price<=c.max*1.1){s+=15;no.push('الميزانية');}else return;
    if(c.hoods.indexOf(p.hood)>-1){s+=25;ok.push('الحي');}else no.push('الحي');
    if(c.types.indexOf(p.type)>-1){s+=15;ok.push('النوع');}else no.push('النوع');
    if(!c.beds)s+=10;else if(p.beds>=c.beds){s+=15;ok.push('الغرف');}
    else if(p.beds===c.beds-1){s+=7;no.push('الغرف');}else no.push('الغرف');
    s+=15;
    if(s>=45)out.push({p:p,score:Math.round(s),ok:ok,no:no});
  });
  return out.sort(function(a,b){return b.score-a.score;});
}
function payStatus(x){if(x.paid>=x.amount)return'مدفوع';
  var d=Math.round((TODAY-new Date(x.due))/864e5);return d>5?'متأخر':'مستحق';}

function badges(){
  return {today:EQ.filter(function(e){return e.triage==='new';}).length +
                C.filter(function(c){return slaState(c)==='breached';}).length,
          reqs:C.filter(function(c){return slaState(c)!=='answered';}).length,
          props:P.filter(function(p){return p.status!=='معتمد';}).length,
          deals:D.length,more:0};
}

function go(k,sub){
  NAV=k;SUB=sub||0;closeSheet();render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function setSub(i){SUB=i;render(true);}

function render(sameNav){
  var n=NAVS[NAV]||SECTIONS[NAV];
  var isSec=!NAVS[NAV];
  document.getElementById('hT').textContent=isSec?n.t:n.h;
  document.getElementById('hS').textContent=isSec?n.d:n.s;
  document.getElementById('rolePill').textContent=ROLE==='admin'?'مدير':'مسوّق';

  var subs=n.subs||[];
  document.getElementById('subs').innerHTML=subs.map(function(s,i){
    return '<button class="sb '+(SUB===i?'on':'')+'" onclick="setSub('+i+')">'+s+'</button>';
  }).join('')+(isSec?'<button class="sb" onclick="go(\'more\')">← الأقسام</button>':'');

  var b=badges();
  document.getElementById('bar').innerHTML=Object.keys(NAVS).map(function(k){
    return '<button class="bt '+(NAV===k?'on':'')+'" onclick="go(\''+k+'\')">'+
      '<span class="i">'+NAVS[k].ic+'</span><span class="l">'+NAVS[k].l+'</span>'+
      (b[k]?'<span class="dot num">'+b[k]+'</span>':'')+'</button>';
  }).join('');

  var st=document.getElementById('stage');
  st.className='stage'+(sameNav?' up':'');
  st.innerHTML=VIEWS[NAV]?VIEWS[NAV]():'<div class="empty">—</div>';
}

function todayAlerts(){

  live().forEach(function(p){
    if(p.days>=21&&!vw(p.id).length)items.push({ic:'a',t:p.type+' — '+p.hood,
      s:'مضى '+p.days+' يومًا بلا معاينة واحدة',a:'راجع السعر أو الصور'});
    if(!p.channels.length)items.push({ic:'w',t:p.type+' — '+p.hood,s:'لم يُنشر في أي قناة',a:'انشره الآن'});
  });
  C.forEach(function(c){if(slaState(c)==='breached')
    items.push({ic:'a',t:c.name,s:'طلبه مفتوح منذ '+Math.round(c.opened)+' ساعة بلا رد',a:'أرسل تقريرًا الآن'});});
  live().forEach(function(p){if(p.src==='own'&&p.days>=7)
    items.push({ic:'w',t:'تقرير المالك — '+p.owner,s:'لم يُرسل هذا الأسبوع',a:'أرسله'});});

  if(!items.length)return '<div class="empty"><b>لا تنبيهات</b>كل شيء ضمن المسار</div>';
  return '<div class="sec">يحتاج تدخّلك <b>'+items.length+'</b></div>'+items.map(function(i){
    return '<div class="r top"><div class="ic '+i.ic+'">!</div><div class="rm">'+

  return '<div class="note">اعتراض العميل <b>قائمة محددة لا نص حر</b> — النص الحر لا يمكن جمعه ولا الاستدلال به أمام المالك.</div>'+

function dealLosses(){
  if(!LOST.length)return '<div class="empty"><b>لا خسائر مسجّلة</b>قائمة الأسباب محددة عمدًا — لأنها الإجابة الصادقة الوحيدة عن «لماذا لا نغلق»</div>';
  var t={};LOST.forEach(function(l){t[l.reason]=(t[l.reason]||0)+1;});
  return '<div class="sec">أسباب الخسارة</div>'+Object.keys(t).sort(function(a,b){return t[b]-t[a];}).map(function(r){
    return '<div class="r"><div class="ic a">✕</div><div class="rm"><div class="rt">'+r+'</div></div>'+
    '<div class="rv"><div class="rn num">'+t[r]+'</div></div></div>';}).join('');
}

function triage(id){

function doTriage(id,t,r){
  EQ.forEach(function(e){if(e.id===id){e.triage=t;e.reason=r;e.mins=0;}});
  var e=EQ.filter(function(x){return x.id===id;})[0];
  if(t==='serious'&&!C.some(function(c){return c.phone===e.phone;})){
    C.unshift({id:nC++,name:e.name==='—'?'عميل من '+e.chan:e.name,phone:e.phone,purpose:'إيجار',
      types:['شقة'],hoods:[],min:0,max:99999999,beds:0,opened:0,sent:0,role:'باحث'});
  }
  closeSheet();render();
  toast(t==='serious'?'حُوّل لعميل — أكمل تفاصيل طلبه':'سُجّل غير جاد — يظهر في تقرير المالك');
}

function startDeal(pid,cid){
  if(D.some(function(d){return d.pid===pid&&d.cid===cid;})){toast('توجد صفقة مفتوحة لهذا العميل على نفس العقار');return;}
  D.push({id:nD++,pid:pid,cid:cid,stage:'اهتمام',value:prop(pid).price,days:0});
  go('deals');toast('فُتحت الصفقة');
}
function openDeal(id){
  var d=D.filter(function(x){return x.id===id;})[0],p=prop(d.pid),c=cli(d.cid);
  sheet('<h3>'+(c?c.name:'')+'</h3><div class="sub">'+(p?p.type+' — '+p.hood:'')+' · <span class="num">'+M(d.value)+'</span> ريال</div>'+
  '<div class="f"><label>المرحلة</label><div class="pick">'+STAGES.map(function(s){

  var d=D.filter(function(x){return x.id===id;})[0],c=cli(d.cid);
  COM.push({id:nCOM++,who:'المكتب',basis:d.value,rate:2.5,amount:Math.round(d.value*0.025),

  '<button class="btn g" onclick="closeSheet();go(\'money\',0)">لاحقًا</button>');

function loseDeal(id){

function confirmLoss(id,r){var d=D.filter(function(x){return x.id===id;})[0];
  LOST.push({reason:r,value:d.value});D=D.filter(function(x){return x.id!==id;});
  closeSheet();go('deals',2);toast('سُجّلت الخسارة: '+r);}

function mkContract(pid,cid,total){
  var no='C-2026-'+String(100+nCT).padStart(5,'0');
  var ct={id:nCT++,no:no,pid:pid,cid:cid,start:'2026-09-01',end:'2027-08-31',total:total,freq:'ربع سنوي'};
  CT.push(ct);var per=Math.round(total/4),st=new Date('2026-09-01');
  for(var i=0;i<4;i++){var dt=new Date(st);dt.setMonth(dt.getMonth()+i*3);
    PAY.push({id:PAY.length+1,ctid:ct.id,no:i+1,due:dt.toISOString().slice(0,10),
      amount:i===3?total-per*3:per,paid:0});}
  closeSheet();go('money',1);toast('أُنشئ العقد وتوّلدت ٤ دفعات');
}
function reverseCom(id){var x=COM.filter(function(c){return c.id===id;})[0];
  COM.push({id:nCOM++,who:x.who,basis:x.basis,rate:x.rate,amount:-x.amount,reason:'قيد عكسي: '+x.reason});
  render();toast('أُنشئ قيد عكسي — الأصل لم يُمس');}

function ownerReport(id){
  var p=prop(id),vs=vw(id),t={};
  vs.forEach(function(v){v.obj.forEach(function(o){t[o]=(t[o]||0)+1;});});
  var top=Object.keys(t).sort(function(a,b){return t[b]-t[a];})[0];
  var L=['تقرير عن عقاركم',p.type+' — '+p.hood,'','المدة في السوق: '+p.days+' يومًا',
    'المعاينات: '+vs.length,'قنوات النشر: '+(p.channels.length||0)];
  if(top)L.push('','أكثر ملاحظة تكررت: '+top+' ('+t[top]+' من الزوار)');
  L.push('',vs.length?'':'لم تُسجّل معاينات هذا الأسبوع — نواصل التسويق ونبلغكم أولًا بأول.','مكتب الشرق المميز');
  var txt=L.filter(Boolean).join('\n');
  sheet('<h3>تقرير المالك</h3><div class="sub">'+p.owner+'</div><div class="bubble">'+esc(txt)+'</div>'+
  '<div class="note" style="margin-top:11px">«تقرير أسبوعي حتى لو لم يحدث شيء» — الجملة الوحيدة التي لا تحتاج أن يحدث شيء لتفي بها.</div>'+
  '<button class="btn" onclick="send(\''+p.ophone+'\','+JSON.stringify(txt)+')">إرسال للمالك</button>');
}

function openClientReport(id){
  var c=cli(id),m=match(c),ex={};
  m.forEach(function(r){r.no.forEach(function(n){ex[n]=(ex[n]||0)+1;});});
  var exl=Object.keys(ex).sort(function(a,b){return ex[b]-ex[a];});
  var L=['تقرير عن طلبكم',c.purpose+' · '+c.hoods.join('، '),'',
    'بحثنا في '+live().length+' عقارًا هذا الأسبوع'];
  if(m.length){L.push('وجدنا '+m.length+' خيارًا مطابقًا');
    m.slice(0,3).forEach(function(r){L.push('· '+r.p.type+' — '+r.p.hood+' · '+M(r.p.price)+' ريال');});}
  if(exl.length)L.push('استبعدنا الباقي — أكثر سبب: '+exl[0]);
  if(!m.length)L.push('','لم يطابق أي منها طلبكم. نكمل البحث ونبلغكم فور توفر ما يناسب.');
  L.push('','مكتب الشرق المميز');
  var txt=L.join('\n');
  sheet('<h3>تقرير العميل</h3><div class="sub">'+c.name+'</div><div class="bubble">'+esc(txt)+'</div>'+
  '<div class="note" style="margin-top:11px">الاستبعاد هو المنتج — «فرزنا حتى لا تضيّع وقتك» هي الخدمة التي بعناها.</div>'+
  '<button class="btn" onclick="markSent('+id+','+JSON.stringify(c.phone)+','+JSON.stringify(txt)+')">إرسال</button>');
}
function markSent(id,ph,txt){C.forEach(function(c){if(c.id===id){c.sent++;c.opened=0;}});
  send(ph,txt);closeSheet();render();toast('أُرسل — الوعد أُوفي به');}

function openMore(){go('more');}
function flipRole(){ROLE=ROLE==='admin'?'marketer':'admin';render();
  toast(ROLE==='admin'?'مدير المكتب':'مسوّق متعاون');}

render();
</script>
</body>
