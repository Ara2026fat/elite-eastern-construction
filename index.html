/* كل رسالة تُسجَّل استفسارًا على قناة الموقع، جادة كانت أو لا،
   وإلا صار تقرير القنوات يمدح الموقع بنسبة نجاح ١٠٠٪ كاذبة. */
function logIntake(p,phone,serious,reason){
  return Repo.insert('enquiries',{name:p.name||'—',phone:phone||'',channel:'الموقع',
    mandate_id:null,msg:[p.role,p.purpose,p.type,p.hood,p.note].filter(Boolean).join(' · '),
    triage:serious?'serious':'not_serious',reason:reason||null,
    triaged_at:nowISO(),triaged_by:Session.user.id});
}
function dropIntake(reason){
  logIntake(pDraft,val('pph'),false,reason);
  logAct('enquiry',null,'website','طلب من الموقع صُنّف غير جاد: '+reason,'Website request: not serious');
  pDraft=null;closeSheet();go('chan',1);toast(reason);
}
function saveIntake(){
  var p=pDraft,phone=val('pph');
  if(!phone){toast(L('أدخل رقم الجوال','Enter the phone number'));return;}
  var owner=p.role==='مالك';
  logIntake(p,phone,true);
  var ex=Repo.all('contacts').filter(function(c){return c.phone===phone;})[0];
  var c=ex||Repo.insert('contacts',{name_ar:p.name||L('عميل من الموقع','Website client'),phone:phone,
    role:owner?'مالك':'باحث',source:'الموقع',assigned_to:nextAssignee()});
  /* عميل مسجَّل عاد عبر الموقع: نثبّت المصدر ولا نغيّر صفته ولا من يتابعه */
  if(ex){
    if(!ex.source)Repo.update('contacts',ex.id,{source:'الموقع'});
    logAct('contact',ex.id,'website','عميل مسجَّل أرسل طلبًا عبر الموقع','Existing client wrote via the website');
  }

  if(owner){
    var a=Repo.insert('assets',{type:p.type,desc:p.desc||'',city:p.city||null,hood:p.hood||'',
      beds:p.beds||0,baths:0,area:0,owner_id:c.id,photo:null,photos:[]});
    var m=Repo.insert('mandates',{asset_id:a.id,purpose:p.sys,price:p.price||0,source:'sourced',
      status:isMarketer()?'بانتظار الاعتماد':'معتمد',state:'متاح',by:Session.user.id,channels:[],
      mgmt_fee:p.sys==='إدارة أملاك'?5:undefined,pay_pref:p.pay||null,note:p.note||''});
    logAct('mandate',m.id,'website','عرض من الموقع — '+(p.name||'')+' · '+p.type,'Listing from the website');
    pushTask('web:'+m.id,'استكمال بيانات عقار '+p.type+' من الموقع',todayStr(),Session.user.id,'mandate',m.id);
    Repo.flush();
    pDraft=null;closeSheet();go('props',0);
    toast(L('سُجّل العرض — أكمل المساحة والغرف','Listing saved — complete the details'));
    return;
  }
  /* الرسالة تحمل مرجع عقار: يُربط بها الاستفسار والطلب معًا،
     وإلا صار «سألت عن هذا العقار» كلامًا لا سجلًّا. */
  var hit=p.ref?refFind(p.ref):null;
  var lm=(hit&&hit.kind==='mandate')?hit.row:null, la=lm?asset(lm):null;
  var r=Repo.insert('requirements',{contact_id:c.id,purpose:lm?lm.purpose:p.sys,
    types:[la?la.type:p.type],
    cities:la?(la.city?[la.city]:[]):(p.city?[p.city]:[]),
    hoods:la?(la.hood?[la.hood]:[]):(p.hood?[p.hood]:[]),
    min:p.min||0,max:p.max||99999999,beds:p.beds||0,
    status:'active',assigned_to:c.assigned_to,sent:0,source:'الموقع',
    pay_pref:p.pay||null,note:p.note||'',from_mandate:lm?lm.id:null});
  logAct('requirement',r.id,'website','طلب من الموقع — '+(p.name||'')+' · '+reqRef(r),
    'Requirement from the website');
  if(lm){
    var eqs=Repo.where('enquiries',function(e){return e.phone===phone&&!e.mandate_id;});
    if(eqs.length)Repo.update('enquiries',eqs[eqs.length-1].id,{mandate_id:lm.id});
  }
  if(p.wantView&&lm)newRequestViewing(lm.id,c.id,p.when||null,p.note||'');
  var k=match(r).length;
  pDraft=null;closeSheet();
  if(p.wantView&&lm){go('portal',1);toast(L('سُجّل الطلب وطلب المعاينة — '+reqRef(r),
    'Request and viewing ask recorded — '+reqRef(r)));return;}
  go('match');
  toast(k?L('وُجد '+k+' مطابق — المرجع '+reqRef(r),'Found '+k+' matches — '+reqRef(r))
         :L('لا مطابق — المرجع '+reqRef(r)+' — أرسل ردًّا صريحًا',
            'No match — '+reqRef(r)+' — send an honest reply'));
}

function togCity(cy){
  var i=cDraft.cities.indexOf(cy);

    cDraft.cities.splice(i,1);
    var gone=hoodsOf(cy);
    cDraft.hoods=cDraft.hoods.filter(function(h){
      return gone.indexOf(h)<0||cDraft.cities.some(function(c){return hoodsOf(c).indexOf(h)>-1;});});
  }else cDraft.cities.push(cy);
  hFilter='';reqSheet();
}

/* الترخيص الإعلاني قد يكون واحدًا للمكتب أو رقمًا لكل إعلان.
   لا نفترض: رقم المكتب يُورَّث، ورقم العقار يَجُبّه إن وُجد. */
function adLic(m){
  var o=Repo.find('offices',Session.office.id)||{};
  return m.ad_licence
    ? {no:m.ad_licence,exp:m.ad_expiry||null,own:true}
    : (o.ad_licence?{no:o.ad_licence,exp:o.ad_expiry||null,own:false}:null);
}
/* ── بطاقة العرض ───────────────────────────────────────────────
   السوق يتعامل في واتساب بالصور: تُقرأ وتُعاد إرسالها، والنص لا.
   والصورة إعلان — فتحمل رقم الترخيص كما يحمله الإعلان المكتوب،
   وتخضع لنفس القيد: لا بطاقة لعقار لسنا وكلاءه.
──────────────────────────────────────────────────────────────── */
var CARD_W=1080,CARD_H=1350;
function cardFont(px,w){
  return (w||600)+' '+px+'px -apple-system,"SF Arabic","Segoe UI","Noto Sans Arabic",system-ui,sans-serif';
}
function fitText(ctx,txt,max,start,min){
  var px=start;
  do{ ctx.font=cardFont(px,700); if(ctx.measureText(txt).width<=max)break; px-=4; }while(px>min);
  return px;
}
function drawCard(mid){
  var m=Repo.find('mandates',mid),a=asset(m),o=Repo.find('offices',Session.office.id)||{};
  var cv=document.createElement('canvas');cv.width=CARD_W;cv.height=CARD_H;
  var x=cv.getContext('2d');
  if(!x)return null;
  x.direction='rtl'; x.textAlign='right';
  var R=CARD_W-88;                                  /* حافة اليمين */

  var g=x.createLinearGradient(0,0,CARD_W,CARD_H);
  g.addColorStop(0,'#0C5B50');g.addColorStop(.62,'#0A4F45');g.addColorStop(1,'#06231F');
  x.fillStyle=g;x.fillRect(0,0,CARD_W,CARD_H);

  x.strokeStyle='rgba(201,162,39,.16)';x.lineWidth=2;   /* شبكية خافتة كخلفية الصفحة */
  for(var i=-CARD_H;i<CARD_W;i+=54){x.beginPath();x.moveTo(i,0);x.lineTo(i+CARD_H,CARD_H);x.stroke();}

  x.strokeStyle='#C9A227';x.lineWidth=6;
  x.strokeRect(44,44,CARD_W-88,CARD_H-88);

  x.fillStyle='#C9A227';x.font=cardFont(34,600);
  x.fillText((m.purpose==='بيع'?'للبيع':'للإيجار'),R,150);

  var title=a.type+' — '+a.hood;
  var tp=fitText(x,title,CARD_W-190,86,48);
  x.fillStyle='#F6F4EF';x.font=cardFont(tp,700);
  x.fillText(title,R,262);

  x.fillStyle='rgba(246,244,239,.62)';x.font=cardFont(36,400);
  x.fillText(a.city||'',R,320);

  x.fillStyle='#C9A227';x.fillRect(CARD_W-88-140,364,140,5);

  var specs=[];
  if(a.beds)specs.push(a.beds+' غرف');
  if(a.baths)specs.push(a.baths+' دورات مياه');
  if(a.area)specs.push(M(a.area)+' م²');
  var sy=452;
  x.font=cardFont(40,500);
  specs.forEach(function(t2){
    x.fillStyle='rgba(246,244,239,.9)';x.fillText(t2,R,sy);
    x.fillStyle='#C9A227';x.beginPath();x.arc(R+22,sy-13,7,0,6.3);x.fill();
    sy+=76;
  });

  x.fillStyle='rgba(201,162,39,.12)';
  roundRect(x,88,sy+24,CARD_W-176,182,26);x.fill();
  x.strokeStyle='rgba(201,162,39,.45)';x.lineWidth=3;
  roundRect(x,88,sy+24,CARD_W-176,182,26);x.stroke();
  x.fillStyle='rgba(246,244,239,.6)';x.font=cardFont(32,400);
  x.fillText(m.purpose==='بيع'?'السعر':'الإيجار السنوي',R-34,sy+96);
  x.fillStyle='#C9A227';x.font=cardFont(78,700);
  x.fillText(M(m.price)+' ريال',R-34,sy+178);

  var by=CARD_H-300;
  x.strokeStyle='rgba(201,162,39,.3)';x.lineWidth=2;
  x.beginPath();x.moveTo(88,by);x.lineTo(CARD_W-88,by);x.stroke();

  x.fillStyle='#F6F4EF';x.font=cardFont(42,700);
  x.fillText(shortName(),R,by+70);
  x.fillStyle='rgba(246,244,239,.75)';x.font=cardFont(44,600);
  x.fillText(o.phone||'',R,by+136);

  var lic=adLic(m);
  x.fillStyle='rgba(246,244,239,.5)';x.font=cardFont(26,400);
  x.fillText('ترخيص إعلاني: '+((lic&&lic.no)||'—')+'   ·   فال: '+(o.fal||'—'),R,by+196);
  x.fillText('سجل تجاري: '+(o.cr||'—'),R,by+236);
  return cv;
}
function roundRect(x,l,t,w,h,r){
  x.beginPath();
  x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);
  x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath();
}

  if(isMarket(m))return sheet('<h3>'+L('بطاقة عرض','Listing card')+'</h3>'+

    'Ready to send on WhatsApp. The licence number is printed on it, so it cannot be forgotten.')+'</div>'+
  '<button class="btn" onclick="saveCard(\''+mid+'\')">'+L('حفظ الصورة','Save the image')+'</button>'+

function saveCard(mid){
  var cv=drawCard(mid); if(!cv)return;
  var m=Repo.find('mandates',mid),a=asset(m);
  var el2=document.createElement('a');
  el2.href=cv.toDataURL('image/jpeg',0.92);

  document.body.appendChild(el2);el2.click();document.body.removeChild(el2);

function shareCard(mid){
  var cv=drawCard(mid); if(!cv)return;
  if(!(navigator.share&&navigator.canShare))return saveCard(mid);
  cv.toBlob(function(b){
    var f=new File([b],'card.jpg',{type:'image/jpeg'});
    if(!navigator.canShare({files:[f]}))return saveCard(mid);
    navigator.share({files:[f],text:adText(mid)}).then(function(){
      logAct('mandate',mid,'card_shared','أُرسلت بطاقة العرض','Listing card shared');
    }).catch(function(){});
  },'image/jpeg',0.92);
}

/* رقم مرجعي قصير يُذكر في الإعلان وفي رسالة العميل، فيُعرف العقار بضغطة */
function refOf(m){
  return 'ع-'+String(m.id).replace(/\D/g,'').slice(-4).padStart(4,'0');
}
/* ما يجوز نشره: عرضٌ لنا، متاح، وبرخصة إعلانية سارية، واختاره المكتب للموقع.
   العقار المرصود مستثنى دائمًا — لسنا وكلاءه. */
function webListings(){
  return Repo.where('mandates',function(m){
    if(isMarket(m))return false;
    if(m.status!=='معتمد'||mState(m)!=='متاح')return false;
    if(m.purpose==='إدارة أملاك')return false;
    if((m.channels||[]).indexOf('الموقع')<0)return false;
    return adOK(m);
  });
}
function feedJSON(){
  var o=Repo.find('offices',Session.office.id)||{};
  var rows=webListings().map(function(m){
    var a=asset(m),l=adLic(m);
    return {                       /* بيانات المالك لا تخرج من النظام أبدًا */
      ref:refOf(m), purpose:m.purpose, type:a.type, desc:a.desc||'', city:a.city||'', hood:a.hood||'',
      price:m.price, beds:a.beds||0, baths:a.baths||0, area:a.area||0,
      photo:a.photo||null, ad:(l&&l.no)||'', ad_exp:(l&&l.exp)||'',
      added:dstr(m.created_at)
    };
  });
  return JSON.stringify({
    office:{name:o.name_ar||'',phone:o.phone||'',fal:o.fal||'',cr:o.cr||''},
    generated:nowISO(), count:rows.length, listings:rows
  },null,1);
}
function feedSheet(){
  var rows=webListings(),j=feedJSON(),kb=Math.round(j.length/1024);
  var blocked=Repo.where('mandates',function(m){
    return !isMarket(m)&&m.status==='معتمد'&&mState(m)==='متاح'&&
      m.purpose!=='إدارة أملاك'&&(m.channels||[]).indexOf('الموقع')>-1&&!adOK(m);

  sheet('<h3>'+L('نشر إلى الموقع','Publish to the website')+'</h3>'+
  '<div class="sub">'+L('ملف يُنزَّل ويُرفع إلى مستودع الصفحة العامة',
    'A file you download and upload to the public page repository')+'</div>'+
  '<div class="grid2"><div class="m '+(rows.length?'g':'a')+'"><div class="t">'+
    L('جاهز للنشر','Ready')+'</div><div class="v num">'+rows.length+'</div></div>'+
  '<div class="m"><div class="t">'+L('حجم الملف','File size')+'</div>'+
  '<div class="v num">'+kb+'<small>KB</small></div></div></div>'+
  (blocked.length?'<div class="note" style="border-color:var(--clay)"><b>'+blocked.length+'</b> '+
    L('عقارًا اخترتموه للموقع لكن رخصته الإعلانية ناقصة أو منتهية — لن يُنشر.',
      'chosen for the website but missing or expired advertising licence — will not be published.')+'</div>':'')+
  (rows.length
   ? rows.map(function(m){var a=asset(m);
       return '<div class="r"><div class="ic g">'+(ICONS[a.type]||'🏠')+'</div><div class="rm">'+
       '<div class="rt">'+mandateTitle(m)+'</div>'+
       '<div class="rs num">'+refOf(m)+' · '+M(m.price)+' · '+L('ترخيص','licence')+' '+
       esc((adLic(m)||{}).no||'')+'</div></div></div>';}).join('')
   : '<div class="empty">'+L('لا عقار جاهز للنشر بعد','Nothing ready to publish')+
     '<br>'+L('اختر «الموقع» في قنوات النشر بعد تسجيل الترخيص الإعلاني',
       'Tick “Website” in the publishing channels once the advertising licence is on file')+'</div>')+
  '<div class="note">'+L('بيانات الملّاك لا تخرج في هذا الملف. ويحمل كل عقار رقم ترخيصه الإعلاني كما يوجب النظام.',
    'No owner data leaves in this file. Every listing carries its advertising licence number.')+'</div>'+
  (rows.length?'<button class="btn" onclick="downloadFeed()">'+
    L('نزّل listings.json','Download listings.json')+'</button>':'')+
  (rows.length?'<div class="note">'+L('ارفعه في مستودع الصفحة العامة باسم listings.json بالضبط، بجانب index.html.',
    'Upload it to the public page repository as listings.json, next to index.html.')+'</div>':''));
}
function downloadFeed(){
  var j=feedJSON();
  try{
    var b=new Blob([j],{type:'application/json'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download='listings.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    Repo.update('offices',Session.office.id,{feed_at:nowISO()});
    logAct('office',Session.office.id,'feed','نُشر '+webListings().length+' عقارًا إلى الموقع',
      'Website feed exported');
    render();toast(L('نُزّل — ارفعه في مستودع الصفحة','Downloaded — upload it to the page repo'));
  }catch(e){toast(L('تعذّر التنزيل','Download failed'));}
}

/* مدة التفويض تنتهي كما تنتهي الرخصة — والتسويق بعدها بلا سند */
function authOf(m){
  if(!m.auth||!m.auth.at)return null;
  var end=addMonths(m.auth.at,m.auth.months||3);
  return {at:dstr(m.auth.at),end:end,months:m.auth.months||3,
    exclusive:!!m.auth.exclusive,rate:m.auth.rate,
    left:daysBetween(end,new Date())};
}
function authOK(m){
  if(m.source==='partner')return true;   /* التفويض عند المكتب الشريك */
  if(isMarket(m))return false;
  var a=authOf(m);
  return !!a && a.left>=0;
}
/* نص الاتفاقية — يُرسل للمالك ويُحفظ نصّه كما أُرسل */
function authText(mid,months,exclusive,rate){
  var m=Repo.find('mandates',mid),a=asset(m),o=contactOf(a.owner_id),of=Session.office;
  var start=todayStr(),end=addMonths(start,months);
  var A=[];
  A.push('اتفاقية تسويق عقار');
  A.push('');

function adOK(m){

  var l=adLic(m); if(!l||!l.no)return false;
  if(l.exp&&daysBetween(l.exp,new Date())<0)return false;
  return true;
}

  if(s==='تفاوض')pushTask('neg:'+id,'متابعة التفاوض — '+contactOf(d.contact_id).name_ar,
    new Date(Date.now()+2*864e5).toISOString().slice(0,10),d.owner_user,'deal',id);

  closeSheet();render();dealSheet(id);toast(s);

/* وقت مقروء بالعربية: «الخميس ٤ سبتمبر، ٥:٣٠ مساءً» */
function whenAr(iso){
  var d=new Date(iso);
  if(isNaN(d))return String(iso||'');
  var days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var mons=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var h=d.getHours(),mm=d.getMinutes();
  var ap=h<12?'صباحًا':(h<15?'ظهرًا':'مساءً');
  var h12=h%12; if(!h12)h12=12;
  return days[d.getDay()]+' '+d.getDate()+' '+mons[d.getMonth()]+'، '+
    h12+':'+(mm<10?'0':'')+mm+' '+ap;
}
/* نصّان لا واحد: تأكيد عند الحجز، وتذكير في اليوم نفسه */
function viewMsg(id,kind){
  var v=Repo.find('viewings',id); if(!v)return '';

    V.push(whenAr(v.when));
    if(v.meet)V.push('مكان اللقاء: '+v.meet);
    V.push('');
    V.push('إن طرأ ما يمنعكم، أخبرونا الآن ونعيد الموعد بلا حرج.');
  }else{
    V.push('تأكيد موعد المعاينة');
    V.push('');
    V.push('أهلًا '+c.name_ar+'، حجزنا لكم معاينة:');
    V.push('');
    V.push('العقار: '+a.type+' — '+a.hood+(a.city?'، '+a.city:''));
    if(m)V.push('السعر المطلوب: '+M(m.price)+' ريال'+(m.purpose==='إيجار'?' سنويًا':''));
    if(a.beds)V.push('الغرف: '+a.beds+(a.area?' · المساحة: '+M(a.area)+' م²':''));
    V.push('الموعد: '+whenAr(v.when));
    if(v.meet)V.push('مكان اللقاء: '+v.meet);
    V.push('');
    V.push('نصل قبلكم بعشر دقائق. وإن تعذّر الموعد أخبرونا مسبقًا ونعيد ترتيبه — لا حرج في ذلك.');
  }
  V.push('');
  V.push(o.name_ar+(o.fal?'\nرخصة فال: '+o.fal:''));
  return V.join('\n');
}

/* ── الطلب المعكوس ──────────────────────────────────────────────
   العميل يسأل: ما الذي يناسبني؟  والمالك يسأل: لماذا لم يتحرك؟
   الجواب في البيانات نفسها مقلوبة: كم عميلًا يطابق عقاره فعلًا،
   وكم منهم أخرجهم السعر وحده. هذا رقم لا يُخمَّن ولا يُجامَل.
──────────────────────────────────────────────────────────────── */
function ownerDemand(m){
  var a=asset(m);
  var pool=Repo.where('requirements',function(r){
    if(r.status!=='active')return false;
    if(r.purpose!==m.purpose)return false;
    if((r.cities||[]).length&&a.city&&r.cities.indexOf(a.city)<0)return false;
    if((r.types||[]).length&&r.types.indexOf(a.type)<0)return false;
    if((r.hoods||[]).length&&r.hoods.indexOf(a.hood)<0)return false;
    if(r.beds&&a.beds&&a.beds<r.beds)return false;
    if(r.min&&m.price<r.min)return false;
    return true;
  });
  var reach=pool.filter(function(r){return r.max>=m.price;}).length;
  var gaps=pool.filter(function(r){return r.max<m.price;})
    .map(function(r){return m.price-r.max;}).sort(function(x,y){return x-y;});
  var steps=[],seen={};
  gaps.forEach(function(g){
    var cut=Math.ceil(g/500)*500;
    if(seen[cut])return; seen[cut]=1;
    steps.push({cut:cut,gain:gaps.filter(function(x){return x<=cut;}).length});
  });
  return {pool:pool.length,reach:reach,below:gaps.length,steps:steps.slice(0,3)};
}
/* أين يقع سعره بين المعروض المشابه — لا رأي، بل ترتيب */
function comparables(m){
  var a=asset(m);
  var peers=availableMandates().filter(function(x){
    if(x.id===m.id)return false;
    var b=asset(x);
    return x.purpose===m.purpose&&b.type===a.type&&b.hood===a.hood&&
      (!a.city||!b.city||b.city===a.city);
  });
  if(!peers.length)return null;
  var ps=peers.map(function(x){return x.price;}).sort(function(p,q){return p-q;});
  var mid=ps.length%2?ps[(ps.length-1)/2]
    :Math.round((ps[ps.length/2-1]+ps[ps.length/2])/2);
  return {n:ps.length,min:ps[0],max:ps[ps.length-1],mid:mid,
          rank:ps.filter(function(p){return p<m.price;}).length+1};
}
/* التوصية تُبنى على السبب الأول لا على قائمة نصائح عامة */
function ownerAdvice(m){
  var a=asset(m),vs=viewingsOf(m.id),d=ownerDemand(m),cmp=comparables(m);
  var done=vs.filter(function(v){return v.status==='تمت';});
  var tal={};done.forEach(function(v){(v.obj||[]).forEach(function(x){tal[x]=(tal[x]||0)+1;});});
  var priceObj=tal['السعر']||0;

  if(!(m.channels||[]).length)
    return {k:'publish',t:'عقاركم لم يُنشر في أي قناة بعد. ننشره اليوم، ونوافيكم بأثر ذلك في التقرير القادم.'};
  if(!(a.photos||[]).length&&!a.photo)
    return {k:'photos',t:'لا توجد صور للعقار. العرض بلا صور يُتجاوَز في الغالب قبل قراءة سعره — نحتاج صورًا للمجلس والمطبخ والمدخل.'};
  if(!d.pool)
    return {k:'demand',t:'لا يوجد اليوم طلب مسجّل عندنا لهذا النوع في هذا الحي. هذا لا يعني غياب السوق، بل أن الباحثين لم يصلوا إلينا بعد — نوسّع النشر ونطرحه على المكاتب الشريكة.'};
  if(d.steps.length&&d.below>d.reach&&(priceObj>=Math.ceil(done.length/2)||!done.length))
    return {k:'price',t:'أكثر ما يفصلكم عن السوق هو السعر: '+d.below+' من أصل '+d.pool+
      ' من العملاء المطابقين سقفهم دون سعركم. القرار قراركم، والرقم أمامكم.'};
  if(d.reach&&!done.length)
    return {k:'viewings',t:'يوجد '+nAdj(d.reach,'عميل واحد','عميلان','عملاء','عميلًا')+
      ' سعركم داخل ميزانيتهم ولم تحدث معاينة بعد. نرتّب معاينات هذا الأسبوع ونوافيكم بآرائهم كما قيلت.'};
  if(done.length&&priceObj===0)
    return {k:'hold',t:'الملاحظات لم تتركّز على السعر، وهذا مؤشر جيد. نواصل بنفس الشروط ولا نقترح تعديلًا الآن.'};
  if(cmp&&m.price>cmp.mid)
    return {k:'compare',t:'سعركم أعلى من وسط المعروض المشابه بـ'+M(m.price-cmp.mid)+' ريال. لا يعني ذلك أنه خطأ، لكنه يعني مدة أطول في السوق.'};
  return {k:'steady',t:'العرض يسير ضمن المعتاد لهذا النوع. نواصل ونوافيكم أسبوعيًا.'};
}

function ownerReportText(mid){
  var m=Repo.find('mandates',mid),a=asset(m),o=contactOf(a.owner_id),of=Session.office;
  var nth=(m.reports_sent||0)+1;
  var ord=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس'][nth]||('رقم '+nth);
  var ctA=Repo.where('contracts',function(c){return c.mandate_id===mid&&c.status==='نشط';})[0];
  var Ls=[];

  /* عقار مؤجَّر: التقرير عن التحصيل لا عن التسويق */
  if(ctA){
    var bk=ownerBook(a.id),ar=ctArrears(ctA.id);
    Ls.push('تقرير عن عقاركم — التقرير '+ord);
    Ls.push(a.type+' — '+a.hood+(a.city?' · '+a.city:''));
    Ls.push('');
    Ls.push('العقد '+ctA.no+' · ينتهي في '+dstr(ctA.end)+' (بعد '+Math.max(0,daysLeft(ctA))+' يومًا)');
    Ls.push('المستأجر: '+contactOf(ctA.contact_id).name_ar);
    Ls.push('المحصَّل حتى تاريخه: '+M(ctCollected(ctA.id))+' ريال من '+M(ctA.total));
    if(ar)Ls.push('متأخرات: '+M(ar)+' ريال — المتابعة جارية وسنوافيكم بنتيجتها.');
    else Ls.push('لا متأخرات.');
    var jobs=Repo.where('services',function(x){return x.asset_id===a.id;});
    if(jobs.length){
      var dn=jobs.filter(function(x){return x.status==='منجز';}).length;
      Ls.push('الصيانة: '+jobs.length+' طلبًا ('+dn+' منجزًا)');
    }
    if(bk.mandate){
      Ls.push('');
      Ls.push('حسابكم: محصَّل '+M(bk.collected)+' − مصروفات '+M(bk.expenses)+
        ' − أتعاب الإدارة '+M(bk.mgmt)+' = '+M(bk.earned)+' ريال');
      Ls.push('حُوّل لكم: '+M(bk.paid)+' ريال · الرصيد: '+M(bk.earned-bk.paid)+' ريال');
    }
    if(daysLeft(ctA)<=60)Ls.push('','العقد يقارب نهايته — نبدأ التفاوض على التجديد من الآن لا بعد الانتهاء.');
    Ls.push('');Ls.push(of.name_ar+(of.fal?'\nرخصة فال: '+of.fal:''));
    return Ls.join('\n');
  }

  /* عقار معروض: التقرير عن الطلب والسعر */
  var vs=viewingsOf(mid),done=vs.filter(function(v){return v.status==='تمت';});
  var sched=vs.length-done.length,dm=ownerDemand(m),cmp=comparables(m);
  var tal={};done.forEach(function(v){(v.obj||[]).forEach(function(x){tal[x]=(tal[x]||0)+1;});});
  var keys=Object.keys(tal).sort(function(x,y){return tal[y]-tal[x];});

  Ls.push('تقرير عن عقاركم — التقرير '+ord);
  Ls.push(unitName(a)+' — '+a.hood+(a.city?' · '+a.city:'')+' · '+M(m.price)+' ريال');
  Ls.push('');
  Ls.push('الحالة:');
  Ls.push('· في السوق منذ '+daysOnMarket(m)+' يومًا');
  var nch=(m.channels||[]).length;
  Ls.push('· '+(nch?'منشور في '+nAdj(nch,'قناة واحدة','قناتين','قنوات','قناة'):'غير منشور في أي قناة بعد'));
  Ls.push('· '+(done.length
    ?'تمّت '+nAdj(done.length,'معاينة واحدة','معاينتان','معاينات','معاينة')
    :'لم تحدث معاينة بعد')+
    (sched?' · و'+nAdj(sched,'معاينة واحدة مجدولة','معاينتان مجدولتان',
      'معاينات مجدولة','معاينة مجدولة'):''));

  if(keys.length){
    Ls.push('');
    Ls.push('ما قاله من عاينوه:');
    keys.forEach(function(k){Ls.push('· '+k+' — '+tal[k]+' من '+done.length);});
  }

  Ls.push('');
  Ls.push('الطلب المسجّل عندنا:');
  if(!dm.pool){
    Ls.push('لا يوجد اليوم عميل مسجّل يبحث عن '+a.type+' في '+a.hood+'.');
  }else{
    Ls.push(nAdj(dm.pool,'عميل واحد يبحث','عميلان يبحثان','عملاء يبحثون','عميلًا يبحثون')+
      ' عن '+a.type+' في '+a.hood+'.');
    Ls.push('· '+dm.reach+' سعركم داخل ميزانيتهم');
    Ls.push('· '+dm.below+' سعركم فوق سقفهم');
    if(dm.steps.length){
      Ls.push('');
      Ls.push('ولو خُفّض السعر:');
      dm.steps.forEach(function(x){
        Ls.push('· '+M(x.cut)+' ريال ← يصلكم '+
          nAdj(x.gain,'عميل إضافي واحد','عميلان إضافيان','عملاء إضافيين','عميلًا إضافيًا'));
      });
    }
  }

  if(cmp){
    Ls.push('');
    Ls.push('مقارنة بالمعروض المشابه:');
    Ls.push(nAdj(cmp.n,'عرض مشابه واحد','عرضان مشابهان','عروض مشابهة','عرضًا مشابهًا')+
      '، من '+M(cmp.min)+' إلى '+M(cmp.max)+' ريال، ووسطها '+M(cmp.mid)+'.');
    Ls.push('عقاركم رقم '+(cmp.rank)+' من '+(cmp.n+1)+' من حيث السعر.');
  }

  Ls.push('');
  Ls.push('رأينا:');
  Ls.push(ownerAdvice(m).t);
  Ls.push('');
  Ls.push('وسنوافيكم بتقرير الأسبوع القادم حتى لو لم يجدّ جديد.');
  Ls.push('');
  Ls.push(of.name_ar+(of.fal?'\nرخصة فال: '+of.fal:''));
  return Ls.join('\n');
}

function payLine(r){

}
function reportText(r){
  var c=contactOf(r.contact_id),d=reportData(r),o=Session.office;
  var nth=(r.sent||0)+1;
  var ordinal=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس'][nth]||('رقم '+nth);
  var L1=[];
  L1.push('تقرير عن طلبكم — التقرير '+ordinal);
  L1.push((r.types||[]).join(' أو ')+' لل'+(r.purpose==='بيع'?'شراء':'إيجار')+
    ((r.cities||[]).length?' · '+r.cities.join(' و'):''));
  if((r.hoods||[]).length)L1.push('الأحياء: '+r.hoods.join('، '));
  L1.push('الميزانية: '+M(r.min)+' – '+M(r.max)+' ريال'+(r.beds?' · '+r.beds+' غرف فأكثر':''));
  if(r.pay_pref)L1.push('السداد: '+r.pay_pref);
  if((r.routes||[]).length)L1.push('المسار المطلوب: '+r.routes.map(routeLabel).join('، '));
  L1.push('');

  L1.push(d.pool
    ? 'بحثنا في '+nAdj(d.pool,'عرض واحد','عرضين','عروض','عرضًا')+' تطابق نوع طلبكم.'
    : 'لا يوجد اليوم لدينا أي عرض من هذا النوع. نبحث عنه لدى الملاك والمكاتب الشريكة.');
  L1.push('');

  if(d.hits.length){
    L1.push('من عروضنا، وجدنا '+nAr(d.hits.length,'خيار','خيارين','خيارات','خيارًا')+':');
    d.hits.slice(0,5).forEach(function(x,k){
      var a=x.a,flag=[];
      /* التنازل يُذكر مع الخيار لا في الهامش — وإلا بدا العرض مطابقًا وهو ليس كذلك */
      if(x.m.price>r.max)flag.push('يزيد '+M(x.m.price-r.max)+' عن سقفكم');
      if((r.hoods||[]).length&&r.hoods.indexOf(a.hood)<0)flag.push('خارج أحيائكم المطلوبة');
      if(r.beds&&!a.beds)flag.push('عدد غرفه لم يُسجَّل بعد — نؤكده قبل المعاينة');
      else if(r.beds&&a.beds<r.beds)flag.push('غرفه أقل بواحدة');
      L1.push((k+1)+') '+unitName(a)+' — '+a.hood+' · '+M(x.m.price)+' ريال'+
        (a.beds?' · '+a.beds+' غرف':'')+(a.area?' · '+a.area+' م²':'')+
        '\n   ['+routeLabel(routeOf(x.m))+' — '+routeNote(routeOf(x.m))+']'+
        (flag.length?'\n   (نعرضه رغم أنه '+flag.join('، و')+')':''));
    });
    if(d.hits.length>5)L1.push('وبقيتها نعرضها عند المعاينة.');
  }else{
    L1.push('لا يوجد في عروضنا اليوم ما يطابق طلبكم، ولن نرسل لكم ما لا يناسبكم.');
  }
  /* ما رصدناه في السوق ليس عرضنا — يُقال ذلك، ولا يُمرَّر كأنه مخزوننا */
  if(d.spot.length){
    L1.push('');
    L1.push('ورصدنا لكم في السوق العام '+
      nAr(d.spot.length,'عقار','عقارين','عقارات','عقارًا')+' يطابق طلبكم:');
    d.spot.slice(0,4).forEach(function(x,k){
      var a=x.a,st=x.m.market_status||'رُصد';
      L1.push((k+1)+') '+unitName(a)+' — '+a.hood+' · '+M(x.m.price)+' ريال'+
        (a.beds?' · '+a.beds+' غرف':'')+
        '\n   ('+(st==='تواصلنا'?'تواصلنا مع مالكه وننتظر رده'
                 :st==='لا يرد'?'نحاول الوصول إلى مالكه'
                 :'نتواصل مع مالكه اليوم')+')');
    });
    L1.push('هذه لسنا وكلاءها — رصدناها لكم ونسعى للوصول إلى ملّاكها.');
  }

  var keys=d.order.filter(function(k){return d.tally[k];});
  if(keys.length){
    L1.push('');
    L1.push('واستبعدنا '+nAr(d.rest,'عرض','عرضين','عروض','عرضًا')+':');
    keys.forEach(function(k){ L1.push('· '+d.tally[k]+' '+OUT_AR[k]); });
  }

  if(!d.hits.length&&d.near){
    L1.push('');
    if(d.near.k==='over')
      L1.push('أقرب ما وجدناه يزيد '+M(d.near.v)+' ريال عن سقفكم. برفع السقف قليلًا تتسع الخيارات.');
    else if(d.near.k==='hood')
      L1.push('أقرب ما وجدناه في حي '+d.near.hood+'. بإضافته إلى أحيائكم تتسع الخيارات.');
  }

  L1.push('');
  var spotted=Repo.where('mandates',function(m){
    return isMarket(m)&&m.purpose===r.purpose&&['رُصد','تواصلنا','لا يرد'].indexOf(m.market_status)>-1;}).length;
  L1.push(spotted
    ? 'وما زلنا نبحث خارج عروضنا: '+nAr(spotted,'عقار','عقارين','عقارات','عقارًا')+
      ' قيد التواصل مع ملّاكها الآن.'
    : 'وما زلنا نبحث لدى ملاك غير معلنين ومكاتب شريكة.');
  L1.push('وسنوافيكم بتقرير الأسبوع القادم حتى لو لم يجدّ جديد.');
  L1.push('');
  L1.push('إن تغيّر شيء في طلبكم — ميزانية أو حي أو عدد غرف — أخبرونا وسنعيد البحث فورًا.');
  if(!(r.routes||[]).length&&d.hits.length)
    L1.push('وإن أردتم قصر البحث على المباشر من الملّاك دون غيره، أخبرونا.');
  L1.push('');
  L1.push(o.name_ar+(o.fal?'\nرخصة فال: '+o.fal:''));
  return L1.join('\n');
}

/* ════════════════════════════════════════════════════════════════
   12E · المرحلة الثالثة — دورة العميل من طرفها إلى طرفها
   العقار ← العميل ← الطلب ← المطابقة ← التواصل ← المعاينة ←
   العرض ← التفاوض ← الصفقة ← العقد ← الدفع ← الإغلاق

   ثلاث واجهات على قاعدة واحدة: المكتب يرى الكل، العميل يرى طلبه،
   المالك يرى عقاره. ولا تتسرّب بيانات طرف إلى الآخر.
   ════════════════════════════════════════════════════════════════ */

/* ── المرجع ───────────────────────────────────────────────────
   بلا رقم يُذكر، لا متابعة. العميل يقول «ط-٠٠٤٢» فيصل المكتب
   إلى طلبه في ثانية، والمالك يقول «ع-٠٠١٧» فيصل إلى عقاره. */
function reqRef(r){
  return 'ط-'+String(r&&r.id||'').replace(/\D/g,'').slice(-4).padStart(4,'0');
}
/* الحرف قبل الرقم ليس زينة: «ط-٠٠٠١» طلب و«ع-٠٠٠١» عقار، وقد
   يحملان الأرقام نفسها. من أهمل الحرف أوصل العميل إلى عقار غيره. */
function refFind(code){
  var c=String(code||'').trim();
  var d=digits(c); if(d.length<3)return null;
  var wantReq=/^\s*ط/.test(c)||/^\s*R/i.test(c);
  var wantMan=/^\s*ع/.test(c)||/^\s*P/i.test(c);
  var r=Repo.all('requirements').filter(function(x){return digits(reqRef(x))===d;})[0];
  var m=Repo.all('mandates').filter(function(x){return digits(refOf(x))===d;})[0];
  if(wantReq)return r?{kind:'req',row:r}:null;
  if(wantMan)return m?{kind:'mandate',row:m}:null;
  if(r)return {kind:'req',row:r};
  if(m)return {kind:'mandate',row:m};
  return null;
}

/* ── الرحلة ───────────────────────────────────────────────────
   اثنتا عشرة خطوة تُقرأ في سطر واحد. لا تُحسب من حقل واحد بل من
   الوقائع: هل تمّت معاينة؟ هل قُدّم عرض؟ هل وُقّع عقد؟ */
var JOURNEY=[['العقار','Property'],['العميل','Client'],['الطلب','Request'],['المطابقة','Match'],
  ['التواصل','Contact'],['المعاينة','Viewing'],['العرض','Offer'],['التفاوض','Negotiation'],
  ['الصفقة','Deal'],['العقد','Contract'],['الدفع','Payment'],['الإغلاق','Closing']];

function journeyOfDeal(d){
  if(!d)return 2;
  var vs=Repo.where('viewings',function(v){return v.deal_id===d.id;});
  var os=Repo.where('offers',function(o){return o.deal_id===d.id;});
  var ct=Repo.all('contracts').filter(function(c){return c.deal_id===d.id;})[0];
  var i=4;                                        /* صفقة مفتوحة = تواصل تمّ */
  if(vs.length)i=5;
  if(vs.filter(function(v){return v.status==='تمت';}).length)i=5;
  if(os.length)i=6;
  if(os.length>1||os.filter(function(o){return o.status==='مضاد';}).length)i=7;
  if(d.agreed||d.stage==='اتفاق')i=8;
  if(ct)i=9;
  if(ct){
    var ps=Repo.where('payments',function(p){return p.contract_id===ct.id;});
    if(ps.filter(function(p){return (p.paid||0)>0;}).length)i=10;
  }
  if(d.stage==='مغلقة'||d.stage==='عقد'&&ct&&ct.status!=='نشط')i=11;
  if(isClosed&&isClosed(d)&&d.stage!=='خسارة')i=11;
  return i;
}
function journeyRail(i,note){
  return '<div class="sec">'+L('الرحلة','The journey')+' <b class="num">'+(i+1)+'/12</b></div>'+
  '<div class="chips" style="gap:4px">'+JOURNEY.map(function(s,k){
    var on=k<=i, now=k===i;
    return '<span class="chip'+(on?'':' no')+'" style="'+
      (now?'background:var(--jade);color:#fff;border-color:var(--jade);font-weight:700':
       on?'background:rgba(10,79,69,.10);border-color:rgba(10,79,69,.28)':'opacity:.45')+
      ';font-size:11px;padding:4px 8px">'+bi(s)+'</span>';}).join('')+'</div>'+
  (note?'<div class="rs wrap" style="margin-top:6px;color:var(--muted)">'+esc(note)+'</div>':'');
}

function portalList(){
  return webListings().filter(function(m){
    var a=asset(m);
    if(PF.purpose&&m.purpose!==PF.purpose)return false;
    if(PF.city&&a.city!==PF.city)return false;
    if(PF.hood&&a.hood!==PF.hood)return false;

function portalContact(n,p){

    return ex; }
  return Repo.insert('contacts',{name_ar:n,name_en:n,phone:p,role:'باحث',
    source:'الموقع',assigned_to:nextAssignee()});
}

var TRK={q:'',res:null};
function portalTrackView(){
  var h='<div class="note">'+L('هذه هي شاشة المتابعة كما يفتحها العميل. اكتب جواله أو مرجع طلبه لترى ما يراه — لا أكثر.',
   'This is the tracking screen as the client opens it. Enter their phone or reference to see exactly what they see.')+'</div>'+
   '<div class="f"><label>'+L('الجوال أو المرجع','Phone or reference')+'</label>'+
   '<input id="trk" value="'+esc(TRK.q)+'" placeholder="05XXXXXXXX '+L('أو','or')+' ط-0001" '+
   'oninput="TRK.q=this.value" onchange="portalTrack()"></div>'+
   '<button class="btn" onclick="portalTrack()">'+L('اعرض الحالة','Show status')+'</button>';
  if(TRK.res===null)return h;
  if(!TRK.res.length)return h+'<div class="empty"><b>'+L('لا طلب بهذا الرقم','No request found')+'</b>'+
    L('تأكد من الجوال أو المرجع','Check the phone or the reference')+'</div>';
  return h+TRK.res.map(trackCard).join('');
}
function portalTrack(){
  var q=TRK.q||'',d=digits(q),out=[];
  if(!q.trim()){TRK.res=null;render(true);return;}
  var byRef=refFind(q);
  if(byRef&&byRef.kind==='req')out.push(byRef.row);
  if(!out.length&&d.length>=4){
    var cs=Repo.all('contacts').filter(function(c){return digits(c.phone||'').indexOf(d)>-1;});
    cs.forEach(function(c){
      Repo.where('requirements',function(r){return r.contact_id===c.id;}).forEach(function(r){out.push(r);});
    });
  }
  TRK.res=out;render(true);
}
/* بطاقة الحالة: ما وصل إليه الطلب، وما ينتظره العميل منّا */
function trackCard(r){

   'Every property has a page its owner opens to see what actually happened — never a client’s name or number.')+'</div>';
  if(!ms.length)return h+'<div class="empty"><b>'+L('لا عقار بعد','No property yet')+'</b></div>';
  var byOwner={};
  ms.forEach(function(m){var a=asset(m);var k=a.owner_id||'—';(byOwner[k]=byOwner[k]||[]).push(m);});
  return h+Object.keys(byOwner).map(function(k){
    var own=k==='—'?{name_ar:L('بلا مالك مسجَّل','No owner on file')}:contactOf(k);
    return '<div class="sec">'+esc(own.name_ar)+' <b class="num">'+byOwner[k].length+'</b></div>'+
    byOwner[k].map(function(m){
      var s=ownerStats(m);
      return '<button class="r top" onclick="ownerTrack(\''+m.id+'\')">'+
      '<div class="ic '+(s.viewings?'g':s.enquiries?'w':'')+'">'+(ICONS[asset(m).type]||'🏠')+'</div>'+
      '<div class="rm"><div class="rt">'+mandateTitle(m)+' <span class="rs num">'+esc(refOf(m))+'</span></div>'+
      '<div class="rs">'+esc(m.purpose)+' · '+esc(mState(m))+' · <span class="num">'+M(m.price)+'</span></div>'+
      '<div class="rs"><span class="num">'+s.days+'</span> '+t('day')+' · '+
      '<span class="num">'+s.enquiries+'</span> '+L('استفسار','asks')+' · '+
      '<span class="num">'+s.viewings+'</span> '+L('معاينة','viewings')+'</div></div>'+
      '<div class="rv">›</div></button>';}).join('');}).join('');
};
function ownerStats(m){
  var vs=Repo.where('viewings',function(v){return v.mandate_id===m.id;});
  var ds=Repo.where('deals',function(d){return d.mandate_id===m.id;});
  var os=[];ds.forEach(function(d){
    Repo.where('offers',function(o){return o.deal_id===d.id;}).forEach(function(o){os.push(o);});});
  var eq=Repo.where('enquiries',function(e){return e.mandate_id===m.id;});
  var obj={};vs.forEach(function(v){(v.obj||[]).forEach(function(o){obj[o]=(obj[o]||0)+1;});});
  var live=ds.filter(function(d){return !isClosed(d);})[0]||ds[0]||null;
  return {days:daysOnMarket(m),viewings:vs.filter(function(v){return v.status==='تمت';}).length,
    booked:vs.filter(function(v){return v.status==='مجدولة';}).length,
    asked:vs.filter(function(v){return v.status==='مطلوبة';}).length,
    enquiries:eq.length,deals:ds.length,offers:os,obj:obj,live:live,
    best:os.reduce(function(a,o){return Math.max(a,+o.amount||0);},0)};
}
function ownerTrack(mid){
  var m=Repo.find('mandates',mid); if(!m)return;
  var a=asset(m),s=ownerStats(m),o=Repo.find('offices',Session.office.id)||{};
  var au=authOf(m),l=adLic(m);
  var objs=Object.keys(s.obj).sort(function(x,y){return s.obj[y]-s.obj[x];});

  var h='<h3>'+mandateTitle(m)+'</h3>'+
  '<div class="sub">'+L('صفحة المالك','Owner page')+' · <span class="num">'+esc(refOf(m))+'</span> · '+esc(mState(m))+'</div>'+
  '<div class="hero '+(s.viewings?'g':'a')+'"><div class="t">'+L('في السوق منذ','On the market for')+'</div>'+
  '<div class="v num">'+s.days+'</div><div class="f">'+t('day')+' · '+
  L('السعر المعروض','asking')+' <span class="num">'+M(m.price)+'</span></div></div>'+
  '<div class="grid3">'+
   [[s.enquiries,L('سؤال','Asks')],[s.viewings,L('عايَن','Viewed')],[s.offers.length,L('عرض','Offers')]]
   .map(function(x){return '<div class="m"><div class="t">'+x[1]+'</div><div class="v num">'+x[0]+'</div></div>';}).join('')+
  '</div>';

  h+=journeyRail(s.live?journeyOfDeal(s.live):(s.enquiries?2:(m.channels||[]).length?1:0),
    s.live?L('الخطوة القادمة: ','Next: ')+nextStepText(s.live)
     :((m.channels||[]).length?L('معروض ولم يصل مهتمّ جادّ بعد','Published, no serious interest yet')
       :L('لم يُنشر بعد على أي قناة','Not published on any channel yet')));

  /* القنوات والسند النظامي: المالك يسأل «أين أعلنتم؟» قبل «كم عرضتم؟» */
  h+='<div class="sec">'+L('أين هو معروض','Where it is published')+'</div>'+
   ((m.channels||[]).length
    ?'<div class="chips">'+m.channels.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('')+'</div>'
    :'<div class="note" style="border-color:var(--clay)">'+L('غير معروض على أي قناة — لا يُنتظر منه نتيجة.',
      'Not published anywhere — no result should be expected.')+'</div>');
  h+='<div class="r"><div class="ic '+(au&&au.left>=0?'g':'a')+'">⚖</div><div class="rm">'+
   '<div class="rt">'+L('التفويض','Authorization')+'</div><div class="rs num">'+
   (au?(au.left>=0?L('سارٍ حتى ','valid to ')+dstr(au.end):L('منتهٍ','expired')):L('غير مسجَّل','not on file'))+
   '</div></div></div>'+
   '<div class="r"><div class="ic '+(adOK(m)?'g':'a')+'">📄</div><div class="rm">'+
   '<div class="rt">'+L('ترخيص الإعلان','Advertising licence')+'</div>'+
   '<div class="rs num">'+esc((l&&l.no)||L('غير مسجَّل','not on file'))+'</div></div></div>';

  /* الاعتراضات: الجواب الوحيد المقنع على «لماذا لم يُؤجَّر؟» */
  h+='<div class="sec">'+L('ما قاله من عايَن','What viewers said')+'</div>';
  h+= objs.length
    ? '<div class="chips">'+objs.map(function(k){
        return '<span class="chip no">'+esc(k)+' <b class="num">'+s.obj[k]+'</b></span>';}).join('')+'</div>'+
      '<div class="rs wrap" style="margin-top:6px;color:var(--muted)">'+
      L('تكرار الاعتراض على «'+objs[0]+'» '+s.obj[objs[0]]+' مرة ليس رأيًا — هو ما يمنع الإقفال.',
        'The repeated objection on “'+objs[0]+'” is what is blocking the close.')+'</div>'
    : '<div class="empty" style="padding:12px">'+
      (s.viewings?L('لم يُسجَّل اعتراض بعد','No objection recorded yet')
                 :L('لم تتم معاينة بعد','No viewing has taken place yet'))+'</div>';

  if(s.best)h+='<div class="sec">'+L('أعلى عرض وصل','Best offer received')+'</div>'+
   '<div class="hero g"><div class="v num">'+M(s.best)+'</div><div class="f">'+t('sar')+
   ' · '+L('فرق عن المطلوب','vs asking')+' <span class="num">'+M(m.price-s.best)+'</span></div></div>';

  if(s.asked||s.booked)h+='<div class="note">'+
    (s.asked?L('طلبات معاينة بانتظار موافقتكم: ','Viewing requests awaiting your availability: ')+s.asked+'. ':'')+
    (s.booked?L('مواعيد مؤكدة قادمة: ','Confirmed upcoming viewings: ')+s.booked+'.':'')+'</div>';

  h+='<div class="note">'+L('لا يظهر في هذه الصفحة اسم أي عميل ولا رقمه — وهذا شرط بقاء ثقة الطرفين معًا.',
    'No client name or number appears on this page — the condition on which both sides keep trusting us.')+'</div>'+
  '<button class="btn" onclick="ownerTrackSend(\''+mid+'\')">'+L('أرسلها للمالك','Send it to the owner')+'</button>'+
  '<button class="btn o" onclick="ownerReport(\''+mid+'\')">'+L('التقرير الكامل','Full report')+'</button>';
  sheet(h);
}
/* نص المتابعة: وقائع مرقّمة، وخطوة واحدة صريحة في آخره */
function ownerTrackText(mid){
  var m=Repo.find('mandates',mid),a=asset(m),s=ownerStats(m);
  var o=Repo.find('offices',Session.office.id)||{};
  var own=a.owner_id?contactOf(a.owner_id):{name_ar:''};
  var objs=Object.keys(s.obj).sort(function(x,y){return s.obj[y]-s.obj[x];});
  var V=[];
  V.push('متابعة عقاركم — '+refOf(m));
  V.push('');
  if(own.name_ar)V.push('أهلًا '+own.name_ar+'،');
  V.push(unitName(a)+' — '+(a.hood||'')+(a.city?'، '+a.city:''));
  V.push('السعر المعروض: '+M(m.price)+' ريال'+(m.purpose==='إيجار'?' سنويًا':''));
  V.push('في السوق منذ: '+s.days+' يومًا');
  V.push('');
  V.push('ما جرى:');
  V.push('• استفسارات: '+s.enquiries);
  V.push('• معاينات تمّت: '+s.viewings);
  if(s.booked)V.push('• مواعيد مؤكدة قادمة: '+s.booked);
  if(s.asked)V.push('• طلبات معاينة تنتظر موعدكم: '+s.asked);
  V.push('• عروض أسعار: '+s.offers.length+(s.best?' — أعلاها '+M(s.best)+' ريال':''));
  if((m.channels||[]).length){V.push('');V.push('قنوات النشر: '+m.channels.join('، '));}
  if(objs.length){
    V.push('');
    V.push('ما قاله من عايَن:');
    objs.slice(0,3).forEach(function(k){V.push('• '+k+': '+s.obj[k]+' مرة');});
  }
  V.push('');
  V.push('الخطوة القادمة: '+(s.live?nextStepText(s.live)
    :((m.channels||[]).length?(objs.length?'مراجعة «'+objs[0]+'» — هو المتكرر':'الاستمرار في العرض ورفع وتيرة التواصل')
      :'اعتماد قنوات النشر لبدء العرض')));
  V.push('');
  V.push(o.name_ar+(o.fal?'\nرخصة فال: '+o.fal:''));
  return V.join('\n');
}
function ownerTrackSend(mid){
  var m=Repo.find('mandates',mid),a=asset(m);
  var own=a.owner_id?contactOf(a.owner_id):null;
  var tx=ownerTrackText(mid);
  sheet('<h3>'+L('متابعة المالك','Owner update')+'</h3>'+
  '<div class="sub">'+(own?esc(own.name_ar):L('بلا مالك مسجَّل','No owner on file'))+'</div>'+
  '<div class="bubble">'+esc(tx)+'</div>'+
  '<div class="note" style="margin-top:11px">'+L('تُرسل ولو لم يجدّ شيء — المالك الذي لا يسمع يظن أن عقاره نُسي.',
    'It goes out even when nothing happened — silence makes an owner think the property was forgotten.')+'</div>'+
  (own&&own.phone?'<button class="btn" onclick="sendOwnerTrack(\''+mid+'\','+JSON.stringify(own.phone)+','+JSON.stringify(tx)+')">'+t('send')+'</button>':'')+
  '<button class="btn g" onclick="copyReport('+JSON.stringify(tx)+')">'+L('انسخ','Copy')+'</button>');
}
function sendOwnerTrack(mid,ph,tx){
  logAct('mandate',mid,'owner_update','أُرسلت متابعة للمالك','Owner update sent');
  Repo.update('mandates',mid,{owner_update_at:nowISO()});
  send(ph,tx);render();
}

/* ── يعمل بلا شبكة ─────────────────────────────────────────────
   البيانات في الجهاز أصلًا، فالناقص هو ملف التطبيق. عامل الخدمة
   يحفظه، وطريقته «الشبكة أولًا» حتى يصل التحديث فور رفعه. */
var SW=null;
function markNet(){
  var off=(typeof navigator!=='undefined')&&navigator.onLine===false;
  if(document.body)document.body.className=off?'off':'';
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('online',markNet);
  window.addEventListener('offline',markNet);
}
function initSW(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol==='file:')return;      /* لا يعمل على ملف محلي، ولا داعي لخطأ في السجل */
  navigator.serviceWorker.register('./sw.js').then(function(r){SW=r;}).catch(function(){});
  navigator.serviceWorker.addEventListener('message',function(e){
    if(e.data==='eec:flushed')location.reload();
  });
}
/* منفذ هروب: إن علق المكتب على نسخة قديمة */
function flushApp(){
  if(!navigator.serviceWorker||!navigator.serviceWorker.controller){
    toast(L('لا توجد ذاكرة محفوظة','Nothing cached'));return;
  }
  sheet('<h3>'+L('تحديث التطبيق','Refresh the app')+'</h3>'+
  '<div class="note">'+L('يُمسح ملف التطبيق المحفوظ ويُحمَّل من جديد. بياناتك لا تُمسّ — فهي محفوظة منفصلة عن التطبيق.',
    'The cached app file is cleared and re-downloaded. Your data is untouched; it is stored separately.')+'</div>'+
  '<button class="btn" onclick="navigator.serviceWorker.controller.postMessage(\'eec:flush\')">'+
    L('امسح واعِد التحميل','Clear and reload')+'</button>');
}

Store.loadKV(function(){
  Repo.load();
  restoreSession();
  if(Session.user)runChecks();
  render();
  markNet();
  initSW();
});
</script>
